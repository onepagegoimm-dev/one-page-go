<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fisherman's Dock 開團中</title>
<meta name="description" content="Fisherman's Dock 漁港直送海鮮團購，揪團更便宜、到點自取。">
<meta property="og:title" content="Fisherman's Dock — 漁港直送">
<meta property="og:description" content="當日現撈海鮮，成團就出貨，揪朋友一起更便宜。">
<meta property="og:image" content="https://one-page-go.com/demos/groupbuy-dock/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── 主題 token（暖砂）；版型＝開團看板（T-034 版型 2）──
     交付其他品牌時換 :root token 與品牌文案，版型不動 */
  :root {
    --bg: #f2ede4; --surface: #fbf8f2; --surface-alt: #e4dccd;
    --primary: #b06f44; --primary-dk: #8c5635; --accent: #7d9068; --extra: #d9b075;
    --heading: #3a352d; --text: #4d473d; --muted: #79705f;
    --success: #6f8f5c; --err: #a24b2e; --shadow: rgba(58,53,45,.10);
    --btn: #8c5635; --on-btn: #ffffff; --radius: 14px;
    --font-head: "Fraunces", "Noto Serif TC", serif;
    --font-body: "Noto Sans TC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15.5px; line-height:1.8; min-height:100vh; overflow-x:hidden; }
  .hidden { display:none !important; }
  img { max-width:100%; }
  .wrap { max-width:560px; margin:0 auto; padding:0 18px 150px; }

  /* 頂部橫幅＋店家戰績 */
  .banner { background:linear-gradient(135deg, var(--primary), var(--extra)); border-radius:0 0 28px 28px; margin:0 -18px; padding:26px 24px 22px; color:#fff; text-align:center; }
  .banner .logo-badge { display:inline-grid; place-items:center; width:52px; height:52px; border-radius:18px; background:rgba(255,255,255,.92); font-size:1.5rem; }
  .banner h1 { font-family:var(--font-head); font-size:1.7rem; font-weight:700; margin-top:6px; }
  .banner .tagline { font-size:.78rem; opacity:.94; }
  .banner .totals { display:flex; justify-content:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .banner .totals div { background:rgba(255,255,255,.24); border-radius:14px; padding:8px 16px; font-size:.72rem; min-width:88px; }
  .banner .totals b { display:block; font-family:var(--font-head); font-size:1.25rem; }

  /* 篩選膠囊 */
  .filters { display:flex; gap:8px; overflow-x:auto; padding:16px 0 6px; scrollbar-width:none; }
  .filters::-webkit-scrollbar { display:none; }
  .chip { flex-shrink:0; padding:9px 18px; border-radius:999px; background:var(--surface); border:1.5px solid var(--surface-alt); font-size:.82rem; color:var(--muted); cursor:pointer; font-family:inherit; min-height:44px; transition:all .18s; }
  .chip.on { background:var(--heading); border-color:var(--heading); color:#fff; font-weight:700; }

  /* 看板列 */
  .row { background:var(--surface); border-radius:18px; box-shadow:0 10px 26px var(--shadow); padding:14px 16px 16px; margin-bottom:12px; display:grid; grid-template-columns:56px 1fr; gap:14px; align-items:center; cursor:pointer; border:2px solid transparent; transition:transform .2s ease, border-color .2s ease; }
  .row:hover { transform:translateY(-2px); }
  .row.on { border-color:var(--primary); }
  .row.closed { opacity:.72; cursor:default; }
  .row .ph { width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg, var(--accent), var(--primary)); display:grid; place-items:center; font-size:1.6rem; overflow:hidden; }
  .row .ph img { width:100%; height:100%; object-fit:cover; }
  .row .top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .row .nm { font-family:var(--font-head); font-weight:600; font-size:1.06rem; color:var(--heading); min-width:0; }
  .row .price { font-family:var(--font-head); font-weight:700; font-size:1.15rem; color:var(--primary-dk); white-space:nowrap; }
  .bar { height:14px; border-radius:999px; background:var(--surface-alt); overflow:hidden; margin:7px 0 5px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--primary), var(--extra)); border-radius:999px; transition:width .6s cubic-bezier(.18,.89,.32,1.1); }
  .bar.done i { background:linear-gradient(90deg, var(--success), #7fdca8); }
  .row .meta { display:flex; justify-content:space-between; gap:10px; font-size:.74rem; color:var(--muted); flex-wrap:wrap; }
  .row .meta .hot { color:var(--primary-dk); font-weight:700; }
  .row .meta .ok { color:var(--success); font-weight:700; }
  .row .badge { display:inline-block; font-size:.66rem; font-weight:900; padding:2px 9px; border-radius:999px; margin-left:6px; vertical-align:1px; font-family:var(--font-body); }
  .badge.rush { background:#ffe4dc; color:var(--primary-dk); }
  .badge.done { background:#d9f7e6; color:#0f8a48; }
  .badge.closed { background:var(--surface-alt); color:var(--muted); }
  .skeleton { height:92px; border-radius:18px; margin-bottom:12px; background:linear-gradient(90deg, var(--surface-alt) 25%, var(--surface) 50%, var(--surface-alt) 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .empty { text-align:center; color:var(--muted); font-size:.88rem; padding:30px 0; }
  .fade-up { opacity:0; transform:translateY(14px); transition:opacity .42s ease, transform .42s ease; }
  .fade-up.in { opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce) { .fade-up { opacity:1; transform:none; transition:none; } .skeleton { animation:none; } .bar i { transition:none; } }

  /* 跟團表單卡 */
  .card { background:var(--surface); border-radius:22px; padding:20px 18px 22px; margin-top:18px; box-shadow:0 14px 34px var(--shadow); }
  .card h3 { font-family:var(--font-head); font-size:1.2rem; color:var(--heading); margin-bottom:8px; }
  .qty-control { display:flex; align-items:center; justify-content:center; gap:18px; margin:8px 0 4px; }
  .qty-control button { width:44px; height:44px; border-radius:16px; border:2px solid var(--surface-alt); background:#fff; color:var(--primary-dk); font-size:1.2rem; font-weight:900; cursor:pointer; font-family:inherit; transition:all .18s; }
  .qty-control button:hover { background:var(--primary); border-color:var(--primary); color:#fff; }
  .qty-control button:active { transform:scale(.92); }
  .qty-control b { font-family:var(--font-head); font-size:1.7rem; min-width:44px; text-align:center; color:var(--heading); }
  .qty-hint { text-align:center; font-size:.74rem; color:var(--muted); }
  .sum-row { display:flex; justify-content:space-between; gap:12px; font-size:.86rem; margin-bottom:4px; }
  .sum-row span:first-child { color:var(--muted); flex-shrink:0; }
  .sum-row.total { border-top:1.5px dashed var(--surface-alt); margin-top:8px; padding-top:8px; }
  .sum-row.total b { font-family:var(--font-head); font-size:1.3rem; color:var(--primary-dk); }
  label { display:block; font-size:.78rem; color:var(--muted); margin:12px 0 5px; }
  input, textarea { width:100%; padding:11px 14px; border:1.5px solid var(--surface-alt); border-radius:14px; font-family:inherit; font-size:.92rem; background:#fff; color:var(--text); }
  input:focus, textarea:focus { outline:2px solid rgba(140,86,53,.25); border-color:var(--primary); }
  .btn-main { background:var(--btn); color:var(--on-btn); border:0; border-radius:999px; padding:13px 26px; font-weight:900; font-size:.96rem; cursor:pointer; font-family:inherit; box-shadow:0 8px 20px rgba(58,53,45,.25); transition:transform .15s, filter .2s; min-height:48px; }
  .btn-main:hover { filter:brightness(1.06); } .btn-main:active { transform:translateY(2px) scale(.99); }
  .btn-main:disabled { opacity:.55; cursor:not-allowed; }
  .btn-line { background:var(--surface); border:1.5px solid var(--surface-alt); color:var(--text); border-radius:999px; padding:9px 18px; font-size:.86rem; cursor:pointer; font-family:inherit; transition:all .2s; min-height:42px; white-space:nowrap; }
  .btn-line:hover { border-color:var(--primary); color:var(--primary-dk); }
  .btn-line:disabled { opacity:.55; cursor:not-allowed; }
  .verify-row { display:flex; gap:10px; }
  .verify-row input { flex:1; min-width:0; }
  .verify-row .btn-line { min-width:118px; }  /* 倒數字寬固定，避免每秒重排觸發捲動錨定跳動 */
  .ok-chip { display:inline-flex; align-items:center; gap:6px; background:#d9f7e6; color:#0f8a48; border-radius:999px; padding:5px 16px; font-size:.82rem; font-weight:700; }
  .hint { font-size:.82rem; margin-top:8px; min-height:1.2em; }
  .hint.ok { color:var(--success); } .hint.err { color:var(--err); }

  /* 底部跟團列 */
  .bottombar { position:fixed; left:50%; transform:translateX(-50%) translateY(140%); bottom:16px; width:min(524px, calc(100% - 36px)); background:var(--heading); color:#fff; border-radius:22px; padding:11px 11px 11px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 18px 40px rgba(58,53,45,.4); z-index:50; transition:transform .3s cubic-bezier(.18,.89,.32,1.12); }
  .bottombar.show { transform:translateX(-50%) translateY(0); }
  .bottombar .info { font-size:.8rem; line-height:1.45; min-width:0; }
  .bottombar .info b { font-family:var(--font-head); color:var(--extra); }
  .bottombar .acts { display:flex; gap:8px; flex-shrink:0; }
  .bottombar .cta { background:var(--primary); color:#fff; border:0; border-radius:16px; padding:11px 20px; font-weight:900; font-size:.9rem; cursor:pointer; font-family:inherit; min-height:44px; }
  .bottombar .sh { background:var(--accent); color:#fff; border:0; border-radius:16px; padding:11px 14px; font-weight:900; font-size:.9rem; cursor:pointer; font-family:inherit; min-height:44px; }

  /* 完成畫面（截圖時刻） */
  #success-view { text-align:center; padding:8vh 18px 40px; }
  .moment { max-width:360px; margin:0 auto; padding:32px 24px 28px; text-align:center; background:var(--surface); border-radius:24px; box-shadow:0 16px 40px var(--shadow); position:relative; overflow:hidden; }
  .moment::before { content:""; position:absolute; top:0; left:0; right:0; height:8px; background:linear-gradient(90deg, var(--primary), var(--extra), var(--accent)); }
  .moment .big { font-family:var(--font-head); font-size:3rem; line-height:1; animation:pop .5s cubic-bezier(.18,.89,.32,1.28); }
  @keyframes pop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
  .moment h3 { font-family:var(--font-head); font-size:1.6rem; color:var(--heading); margin-top:6px; }
  .moment p { color:var(--muted); font-size:.84rem; margin:4px 0 10px; }
  .moment .prog-mini { background:var(--surface-alt); border-radius:14px; padding:10px 14px; margin-bottom:12px; }
  .moment .prog-mini .lbl { display:flex; justify-content:space-between; font-size:.74rem; color:var(--muted); margin-bottom:5px; }
  .moment .prog-mini .lbl b { font-family:var(--font-head); color:var(--heading); }
  .moment .prog-mini .bar { height:10px; margin:0; background:#fff; }
  .moment .oid { display:inline-block; background:var(--surface-alt); border-radius:999px; padding:5px 16px; font-size:.8rem; font-weight:700; color:#9a6a2f; margin-bottom:14px; }
  .confetti { position:absolute; top:-10px; width:8px; height:12px; border-radius:2px; animation:fall 1.2s ease-in forwards; }
  @keyframes fall { to { transform:translateY(420px) rotate(360deg); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display:none; } .moment .big { animation:none; } .bottombar { transition:none; } }

  footer { text-align:center; font-size:.76rem; color:var(--muted); padding:30px 0 8px; }
  footer a { color:var(--primary-dk); }
</style>
</head>
<body>

<div id="shop-view">
  <div class="wrap">
    <div class="banner">
      <div class="logo-badge">🐟</div>
      <h1>Fisherman's Dock</h1>
      <div class="tagline">漁港直送 ・ 揪團更便宜 ・ 到點自取</div>
      <div class="totals">
        <div>正在開團<b id="stat-open">—</b></div>
        <div>已成團<b id="stat-done">—</b></div>
        <div>累計跟團<b id="stat-joined">—</b></div>
      </div>
    </div>

    <div class="filters" id="filters">
      <button class="chip on" onclick="setFilter('all', this)">全部開團</button>
      <button class="chip" onclick="setFilter('rush', this)">快成團</button>
      <button class="chip" onclick="setFilter('soon', this)">即將結束</button>
      <button class="chip" onclick="setFilter('done', this)">已成團</button>
    </div>

    <div id="board"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

    <div class="card hidden" id="join-sec">
      <h3 id="join-anchor">跟團資訊</h3>
      <div class="sum-row"><span>品項</span><span id="sum-name"></span></div>
      <div class="sum-row"><span>單價</span><span id="sum-price"></span></div>

      <label style="text-align:center">選擇份數</label>
      <div class="qty-control">
        <button aria-label="減少" onclick="changeQty(-1)">−</button>
        <b id="qty-display">1</b>
        <button aria-label="增加" onclick="changeQty(1)">＋</button>
      </div>
      <div class="qty-hint" id="qty-hint"></div>

      <div class="sum-row total"><span>小計</span><b id="sum-total"></b></div>

      <label for="f-email">Email <span style="color:var(--err)">*</span></label>
      <div class="verify-row">
        <input type="email" id="f-email" placeholder="you@example.com" autocomplete="email">
        <button class="btn-line" id="send-code-btn" onclick="sendVerifyCode()">發送驗證碼</button>
      </div>
      <div id="code-row" class="hidden">
        <label for="f-code">驗證碼（6 碼）</label>
        <div class="verify-row">
          <input type="text" id="f-code" inputmode="numeric" maxlength="6">
          <button class="btn-line" id="verify-btn" onclick="verifyEmail()">驗證</button>
        </div>
      </div>
      <div id="verified-chip" class="hidden" style="margin-top:10px"><span class="ok-chip">✓ Email 已驗證</span></div>
      <div class="hint" id="verify-hint"></div>

      <label for="f-name">姓名 <span style="color:var(--err)">*</span></label>
      <input type="text" id="f-name" autocomplete="name">
      <label for="f-phone">電話 <span style="color:var(--err)">*</span></label>
      <input type="tel" id="f-phone" placeholder="09xxxxxxxx" autocomplete="tel">
      <label for="f-note">備註</label>
      <textarea id="f-note" rows="2" placeholder="有什麼需要備註的嗎？"></textarea>

      <div style="margin-top:18px; text-align:center">
        <button class="btn-main" id="submit-btn" style="width:100%" onclick="submitGroupOrder()">🐟 確認跟團</button>
        <div class="hint err" id="form-error"></div>
      </div>
    </div>

    <footer>Fisherman's Dock ✦ 當日現撈的鮮度 — Powered by <a href="https://one-page-go.com/" rel="noopener">One Page Go</a></footer>
  </div>

  <div class="bottombar" id="bottombar">
    <span class="info" id="bar-info"></span>
    <span class="acts">
      <button class="sh" aria-label="分享揪團" onclick="shareCampaign()">📣</button>
      <button class="cta" onclick="goJoin()">我要跟團 →</button>
    </span>
  </div>
</div>

<div id="success-view" class="hidden">
  <div class="moment" id="moment-card">
    <div class="big" id="success-emoji">🎉</div>
    <h3 id="success-title">跟團成功！</h3>
    <p id="success-meta"></p>
    <div class="prog-mini">
      <div class="lbl"><span>成團進度</span><b id="success-prog"></b></div>
      <div class="bar"><i id="success-bar" style="width:0%"></i></div>
    </div>
    <span class="oid" id="success-order-id"></span><br>
    <button class="btn-main" onclick="shareResult()">分享揪團給朋友 →</button>
    <div style="margin-top:12px"><button class="btn-line" onclick="resetPage()">再次跟團</button></div>
  </div>
  <footer>Fisherman's Dock ✦ Powered by <a href="https://one-page-go.com/" rel="noopener">One Page Go</a></footer>
</div>

<script>
// ── 設定：交付時替換為該站 worker 的 API 網址 ──
const API_URL = "https://demo-api.one-page-go.com/api"; // demo worker
const SITE_ID = "fishermans-dock"; // demo 接線：所有 action 帶 site_id

const EMOJI = ["🐟","🦐","🦀","🐙","🦑","🐚","🍤","🐡"];
let campaigns = [];
let selectedCampaign = null;
let qty = 1;
let filter = 'all';
let emailVerified = false;
let verifiedEmail = '';
let sessionToken = '';
let countdownTimers = [];
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function setHint(id, msg, ok) {
  const el = document.getElementById(id);
  el.textContent = msg || "";
  el.className = "hint " + (ok ? "ok" : "err");
}
function pctOf(c) {
  const min = parseInt(c.min_qty, 10) || 0;
  const cur = parseInt(c.current_qty, 10) || 0;
  return min > 0 ? Math.min(Math.round((cur / min) * 100), 100) : 0;
}
function msLeft(c) {
  if (!c.deadline) return Infinity;
  return new Date(c.deadline + 'T23:59:59').getTime() - Date.now();
}
function fmtLeft(ms) {
  if (ms <= 0) return '已截止';
  const d = Math.floor(ms / 86400000);
  const h = Math.floor((ms % 86400000) / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  if (d > 0) return '剩 ' + d + ' 天 ' + h + ' 時';
  if (h > 0) return '剩 ' + h + ' 時 ' + m + ' 分';
  return '剩 ' + m + ' 分鐘';
}

// ── 載入開團活動 ──
async function loadCampaigns() {
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getCampaigns', site_id: SITE_ID }) });
    const data = await res.json();
    campaigns = data.campaigns || [];
    renderBoard();
    renderTotals();
  } catch (e) {
    document.getElementById('board').innerHTML = '<div class="empty">載入失敗，請重新整理頁面</div>';
  }
}
function renderTotals() {
  const open = campaigns.filter(c => pctOf(c) < 100 && msLeft(c) > 0).length;
  const done = campaigns.filter(c => pctOf(c) >= 100).length;
  const joined = campaigns.reduce((s, c) => s + (parseInt(c.current_qty, 10) || 0), 0);
  document.getElementById('stat-open').textContent = open + ' 團';
  document.getElementById('stat-done').textContent = done + ' 團';
  document.getElementById('stat-joined').textContent = joined + ' 份';
}
function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  renderBoard();
}
function filtered() {
  return campaigns.filter(c => {
    const pct = pctOf(c), left = msLeft(c);
    if (filter === 'rush') return pct >= 70 && pct < 100 && left > 0;
    if (filter === 'soon') return left > 0 && left <= 86400000 * 2;
    if (filter === 'done') return pct >= 100;
    return true;
  });
}
function renderBoard() {
  const box = document.getElementById('board');
  countdownTimers.forEach(t => clearInterval(t));
  countdownTimers = [];
  const list = filtered();
  if (!list.length) { box.innerHTML = '<div class="empty">這個分類目前沒有團，換一個看看</div>'; return; }

  box.innerHTML = list.map((c, i) => {
    const pct = pctOf(c);
    const min = parseInt(c.min_qty, 10) || 0;
    const max = parseInt(c.max_qty, 10) || 0;
    const cur = parseInt(c.current_qty, 10) || 0;
    const left = msLeft(c);
    const closed = left <= 0 || (max > 0 && cur >= max);
    const short = Math.max(min - cur, 0);
    const ph = c.image_url
      ? '<img src="' + esc(c.image_url) + '" alt="' + esc(c.name) + '" loading="lazy">'
      : EMOJI[i % EMOJI.length];
    let badge = '';
    if (pct >= 100) badge = '<span class="badge done">已成團</span>';
    else if (closed) badge = '<span class="badge closed">已結團</span>';
    else if (pct >= 70) badge = '<span class="badge rush">快成團</span>';
    const status = pct >= 100
      ? '<span class="ok">已達標，持續加開</span>'
      : (closed ? '未達標結團' : '<span class="hot">還差 ' + short + ' 份</span>');
    return '<div class="row fade-up' + (closed && pct < 100 ? ' closed' : '') + '" id="camp-' + esc(c.id) + '"' +
      (closed ? '' : ' onclick="selectCampaign(\'' + esc(c.id) + '\')"') + '>' +
      '<div class="ph">' + ph + '</div><div>' +
      '<div class="top"><span class="nm">' + esc(c.name) + badge + '</span>' +
      '<span class="price">$' + (parseInt(c.price, 10) || 0).toLocaleString() + '</span></div>' +
      '<div class="bar' + (pct >= 100 ? ' done' : '') + '"><i style="width:0%" data-pct="' + pct + '"></i></div>' +
      '<div class="meta"><span>' + cur + ' / ' + min + ' 份 ・ ' + status + '</span>' +
      '<span id="cd-' + esc(c.id) + '">⏰ —</span></div>' +
      '</div></div>';
  }).join("");

  requestAnimationFrame(() => {
    document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('in'), i * 60));
    document.querySelectorAll('.bar i').forEach(el => { el.style.width = el.dataset.pct + '%'; });
  });
  list.forEach(c => startCountdown(c));
}
function startCountdown(c) {
  const el = document.getElementById('cd-' + c.id);
  if (!el) return;
  const update = () => { el.textContent = '⏰ ' + fmtLeft(msLeft(c)); };
  update();
  countdownTimers.push(setInterval(update, 60000));
}

// ── 選團與份數 ──
function selectCampaign(id) {
  selectedCampaign = campaigns.find(c => String(c.id) === String(id));
  if (!selectedCampaign) return;
  document.querySelectorAll('.row').forEach(r => r.classList.remove('on'));
  document.getElementById('camp-' + id).classList.add('on');
  qty = 1;
  updateBar();
}
function maxAvail() {
  const max = parseInt(selectedCampaign.max_qty, 10) || 0;
  const cur = parseInt(selectedCampaign.current_qty, 10) || 0;
  return max > 0 ? Math.max(max - cur, 1) : 99;
}
function changeQty(delta) {
  qty = Math.min(Math.max(1, qty + delta), maxAvail());
  document.getElementById('qty-display').textContent = qty;
  renderJoinSummary();
  updateBar();
}
function updateBar() {
  const bar = document.getElementById('bottombar');
  if (!selectedCampaign) { bar.classList.remove('show'); return; }
  const total = (parseInt(selectedCampaign.price, 10) || 0) * qty;
  document.getElementById('bar-info').innerHTML =
    esc(selectedCampaign.name) + ' ×' + qty + '<b>$' + total.toLocaleString() + '</b>';
  bar.classList.add('show');
}
function renderJoinSummary() {
  if (!selectedCampaign) return;
  const price = parseInt(selectedCampaign.price, 10) || 0;
  document.getElementById('sum-name').textContent = selectedCampaign.name;
  document.getElementById('sum-price').textContent = '$' + price.toLocaleString() + ' / 份';
  document.getElementById('qty-display').textContent = qty;
  document.getElementById('qty-hint').textContent = '每人可跟 1 ~ ' + maxAvail() + ' 份';
  document.getElementById('sum-total').textContent = '$' + (price * qty).toLocaleString();
}
function goJoin() {
  renderJoinSummary();
  document.getElementById('join-sec').classList.remove('hidden');
  document.getElementById('join-anchor').scrollIntoView(); // 即時定位：不依賴平滑動畫，避免與其他捲動互搶
}

// ── 分享揪團（選團後可直接分享）──
async function shareCampaign() {
  const name = selectedCampaign ? selectedCampaign.name : document.title;
  const data = {
    title: document.title,
    text: 'Fisherman\'s Dock 正在開團「' + name + '」，一起跟團更便宜 →',
    url: location.href.split('#')[0]
  };
  try {
    if (navigator.share) { await navigator.share(data); }
    else { await navigator.clipboard.writeText(data.url); alert('連結已複製，貼給朋友揪團吧！'); }
  } catch (_) { /* 使用者取消 */ }
}

// ── Email 驗證 ──
async function sendVerifyCode() {
  const email = document.getElementById('f-email').value.trim();
  if (!email || !EMAIL_RE.test(email)) { setHint('verify-hint', '請輸入有效的 Email', false); return; }
  const btn = document.getElementById('send-code-btn');
  btn.disabled = true;
  try {
    const chk = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'checkMember', site_id: SITE_ID, email }) }).then(r => r.json());
    if (chk.blocked) { setHint('verify-hint', '此 Email 已被停用，請聯繫船長', false); btn.disabled = false; return; }
    if (chk.hasActiveOrder) { setHint('verify-hint', '您有未完成的跟團，結團後才能再次跟團', false); btn.disabled = false; return; }
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'sendVerifyCode', site_id: SITE_ID, email }) });
    const data = await res.json();
    if (data.success) {
      document.getElementById('code-row').classList.remove('hidden');
      setHint('verify-hint', data.message || '驗證碼已寄出，請查看信箱（含垃圾郵件）', true);
      let cd = 60;
      btn.textContent = cd + 's';
      const timer = setInterval(() => {
        cd--;
        btn.textContent = cd + 's';
        if (cd <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '重新發送'; }
      }, 1000);
    } else {
      setHint('verify-hint', data.error || '發送失敗', false);
      btn.disabled = false;
    }
  } catch (e) { setHint('verify-hint', '網路錯誤，請稍後再試', false); btn.disabled = false; }
}
async function verifyEmail() {
  const email = document.getElementById('f-email').value.trim();
  const code = document.getElementById('f-code').value.trim();
  if (!code || code.length !== 6) { setHint('verify-hint', '請輸入 6 位數驗證碼', false); return; }
  const btn = document.getElementById('verify-btn');
  btn.disabled = true;
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyCode', site_id: SITE_ID, email, code }) });
    const data = await res.json();
    if (data.success && data.verified !== false) {
      emailVerified = true;
      verifiedEmail = email;
      sessionToken = data.sessionToken || '';
      document.getElementById('code-row').classList.add('hidden');
      document.getElementById('verified-chip').classList.remove('hidden');
      document.getElementById('send-code-btn').classList.add('hidden');
      document.getElementById('f-email').disabled = true;
      setHint('verify-hint', '', true);
    } else {
      setHint('verify-hint', data.error || '驗證失敗', false);
      btn.disabled = false;
    }
  } catch (e) { setHint('verify-hint', '網路錯誤，請稍後再試', false); btn.disabled = false; }
}

// ── 送出跟團 ──
function showError(msg) { document.getElementById('form-error').textContent = msg; }
async function submitGroupOrder() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const note = document.getElementById('f-note').value.trim();
  showError('');
  if (!selectedCampaign) { showError('請先選擇要跟的團'); return; }
  if (!emailVerified) { showError('請先完成 Email 驗證'); return; }
  if (!name || name.length < 2) { showError('請填寫姓名（至少 2 個字）'); return; }
  if (!/^09\d{8}$/.test(phone.replace(/[-\s]/g, ''))) { showError('請輸入有效的手機號碼（09 開頭）'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitGroupOrder',
        site_id: SITE_ID,
        email: verifiedEmail,
        sessionToken,
        name,
        phone: phone.replace(/[-\s]/g, ''),
        campaign_id: String(selectedCampaign.id),
        qty,
        note
      })
    });
    const data = await res.json();
    if (data.success) {
      showSuccess(data.orderId);
    } else {
      showError(data.error || '跟團失敗');
      btn.disabled = false;
      btn.textContent = '🐟 確認跟團';
    }
  } catch (e) {
    showError('送出失敗，請稍後再試');
    btn.disabled = false;
    btn.textContent = '🐟 確認跟團';
  }
}

// ── 成團達標卡（截圖時刻）──
function showSuccess(orderId) {
  const min = parseInt(selectedCampaign.min_qty, 10) || 0;
  const cur = (parseInt(selectedCampaign.current_qty, 10) || 0) + qty;
  const pct = min > 0 ? Math.min(Math.round((cur / min) * 100), 100) : 100;
  const reached = pct >= 100;

  document.getElementById('shop-view').classList.add('hidden');
  document.getElementById('success-view').classList.remove('hidden');
  document.getElementById('success-emoji').textContent = reached ? '🎉' : '🙌';
  document.getElementById('success-title').textContent = reached ? '成團了！' : '跟團成功！';
  document.getElementById('success-meta').innerHTML = reached
    ? esc(selectedCampaign.name) + ' 已達標<br>我們會通知您付款與取貨時間'
    : esc(selectedCampaign.name) + ' ×' + qty + ' 份<br>還差 ' + Math.max(min - cur, 0) + ' 份就成團，快揪朋友一起！';
  document.getElementById('success-prog').textContent = cur + ' / ' + min + ' 份';
  document.getElementById('success-order-id').textContent = orderId;
  requestAnimationFrame(() => { document.getElementById('success-bar').style.width = pct + '%'; });
  celebrate(document.getElementById('moment-card'));
  window.scrollTo({ top: 0 });
}
function getCSS(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function celebrate(host) {
  const colors = [getCSS('--primary'), getCSS('--extra'), getCSS('--accent')];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * .2) + 's';
    host.appendChild(c);
    setTimeout(() => c.remove(), 1500);
  }
}
async function shareResult() {
  const min = parseInt(selectedCampaign.min_qty, 10) || 0;
  const cur = (parseInt(selectedCampaign.current_qty, 10) || 0) + qty;
  const short = Math.max(min - cur, 0);
  const text = short > 0
    ? '我跟了「' + selectedCampaign.name + '」團，還差 ' + short + ' 份就成團，一起來 →'
    : '「' + selectedCampaign.name + '」成團了！下次一起跟 →';
  try {
    if (navigator.share) { await navigator.share({ title: document.title, text, url: location.href.split('#')[0] }); }
    else { await navigator.clipboard.writeText(location.href.split('#')[0]); alert('連結已複製，貼給朋友揪團吧！'); }
  } catch (_) { /* 使用者取消 */ }
}
function resetPage() { location.reload(); }

// ── 初始化 ──
(function init() {
  loadCampaigns();
})();
</script>
