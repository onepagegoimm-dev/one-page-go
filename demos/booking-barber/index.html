<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharp Cuts Barber 線上預約</title>
<meta name="description" content="Sharp Cuts Barber 線上預約：選服務、挑時段，三分鐘完成。">
<meta property="og:title" content="Sharp Cuts Barber — 精準剪裁">
<meta property="og:description" content="剪裁與熱毛巾修容，線上預約、到店服務。">
<meta property="og:image" content="https://one-page-go.com/demos/booking-barber/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── 主題 token（墨玉）；版型＝行事曆優先（T-033 版型 2）──
     交付其他品牌時換 :root token 與品牌文案，版型不動 */
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface-alt: #e9e7e0;
    --primary: #14563f; --primary-dk: #0e3f2e; --accent: #c8a96a; --extra: #c8a96a;
    --heading: #1b1b18; --text: #33332f; --muted: #6e6c63;
    --success: #2f7d5b; --err: #a03d2e; --shadow: rgba(20,20,18,.10);
    --btn: #14563f; --on-btn: #ffffff; --radius: 8px;
    --font-head: "Cormorant Garamond", "Noto Serif TC", serif;
    --font-body: "Noto Sans TC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15.5px; line-height:1.8; min-height:100vh; overflow-x:hidden; }
  .hidden { display:none !important; }
  img { max-width:100%; }
  .wrap { max-width:520px; margin:0 auto; padding:0 18px 140px; }

  header { text-align:center; padding:34px 0 10px; }
  .logo-dot { width:60px; height:60px; margin:0 auto 10px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--primary)); display:grid; place-items:center; font-size:1.7rem; box-shadow:0 10px 24px var(--shadow); }
  .kicker { font-size:.64rem; letter-spacing:.34em; color:var(--muted); font-weight:700; margin-bottom:2px; }
  h1 { font-family:var(--font-head); font-size:1.9rem; font-weight:700; color:var(--heading); }
  .tagline { font-size:.8rem; color:var(--muted); }
  .proof { display:none; margin-top:8px; background:var(--surface-alt); border-radius:999px; padding:4px 16px; font-size:.76rem; color:var(--heading); }
  .proof.show { display:inline-block; }

  /* 服務膠囊橫滑 */
  .svc-chips { display:flex; gap:8px; overflow-x:auto; padding:16px 0 4px; scrollbar-width:none; }
  .svc-chips::-webkit-scrollbar { display:none; }
  .svc-chip { flex-shrink:0; background:var(--surface); border:1.5px solid var(--surface-alt); border-radius:999px; padding:9px 18px; font-size:.84rem; cursor:pointer; white-space:nowrap; min-height:44px; font-family:inherit; color:var(--text); transition:all .18s; }
  .svc-chip small { color:var(--muted); }
  .svc-chip.on { background:var(--heading); border-color:var(--heading); color:#fff; }
  .svc-chip.on small { color:rgba(255,255,255,.75); }
  .svc-skeleton { height:44px; width:170px; border-radius:999px; flex-shrink:0; background:linear-gradient(90deg, var(--surface-alt) 25%, var(--surface) 50%, var(--surface-alt) 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .svc-skeleton { animation:none; } }

  /* 行事曆檯面（招牌時刻） */
  .calendar { background:var(--surface); border-radius:22px; box-shadow:0 14px 34px var(--shadow); padding:18px 16px 20px; margin-top:14px; }
  .cal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-head b { font-family:var(--font-head); font-size:1.15rem; color:var(--heading); }
  .cal-head .nav { display:flex; gap:6px; }
  .cal-head .nav button { width:36px; height:36px; border-radius:50%; border:1.5px solid var(--surface-alt); background:#fff; color:var(--primary-dk); cursor:pointer; font-size:1rem; }
  .dates { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; scroll-behavior:smooth; }
  .dates::-webkit-scrollbar { display:none; }
  .date-chip { flex-shrink:0; width:58px; text-align:center; background:var(--bg); border:1.5px solid var(--surface-alt); border-radius:14px; padding:8px 0 6px; cursor:pointer; min-height:56px; }
  .date-chip .d { font-family:var(--font-head); font-size:1.15rem; font-weight:700; color:var(--heading); line-height:1.3; }
  .date-chip .w { font-size:.68rem; color:var(--muted); }
  .date-chip.on { background:var(--btn); border-color:var(--btn); }
  .date-chip.on .d, .date-chip.on .w { color:#fff; }
  .cal-divider { height:1.5px; background:var(--surface-alt); margin:14px 0; border-radius:2px; }
  .slots { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .slot { text-align:center; background:var(--bg); border:1.5px solid var(--surface-alt); border-radius:14px; padding:10px 0 8px; cursor:pointer; min-height:52px; font-family:inherit; }
  .slot b { font-size:.95rem; color:var(--heading); }
  .slot small { display:block; font-size:.66rem; color:var(--muted); }
  .slot.on { background:var(--btn); border-color:var(--btn); }
  .slot.on b, .slot.on small { color:#fff; }
  .slot.full { opacity:.4; cursor:not-allowed; }
  .slot.full b { text-decoration:line-through; }
  .slots-note { grid-column:1/-1; text-align:center; color:var(--muted); font-size:.82rem; padding:14px 0; }
  .hintline { text-align:center; font-size:.74rem; color:var(--muted); margin-top:10px; }

  /* 預約資料卡 */
  .card { background:var(--surface); border-radius:22px; padding:20px 18px 22px; margin-top:18px; box-shadow:0 14px 34px var(--shadow); }
  .card h3 { font-family:var(--font-head); font-size:1.2rem; color:var(--heading); margin-bottom:8px; }
  .sum-row { display:flex; justify-content:space-between; gap:12px; font-size:.86rem; margin-bottom:4px; }
  .sum-row span:first-child { color:var(--muted); flex-shrink:0; }
  .sum-row.total { border-top:1.5px dashed var(--surface-alt); margin-top:8px; padding-top:8px; }
  .sum-row.total b { font-family:var(--font-head); font-size:1.25rem; color:var(--btn); }
  label { display:block; font-size:.78rem; color:var(--muted); margin:12px 0 5px; }
  input, textarea { width:100%; padding:11px 14px; border:1.5px solid var(--surface-alt); border-radius:12px; font-family:inherit; font-size:.92rem; background:#fff; color:var(--text); }
  input:focus, textarea:focus { outline:2px solid rgba(20,86,63,.25); border-color:var(--primary); }
  .btn-main { background:var(--btn); color:var(--on-btn); border:0; border-radius:999px; padding:12px 26px; font-weight:700; font-size:.94rem; cursor:pointer; font-family:inherit; box-shadow:0 8px 20px var(--shadow); transition:transform .15s, filter .2s; min-height:48px; }
  .btn-main:hover { filter:brightness(1.08); } .btn-main:active { transform:translateY(2px) scale(.99); }
  .btn-main:disabled { opacity:.55; cursor:not-allowed; }
  .btn-line { background:var(--surface); border:1.5px solid var(--surface-alt); color:var(--text); border-radius:999px; padding:9px 18px; font-size:.86rem; cursor:pointer; font-family:inherit; transition:all .2s; min-height:42px; white-space:nowrap; }
  .btn-line:hover { border-color:var(--primary); color:var(--primary-dk); }
  .btn-line:disabled { opacity:.55; cursor:not-allowed; }
  .verify-row { display:flex; gap:10px; }
  .verify-row input { flex:1; min-width:0; }
  .verify-row .btn-line { min-width:118px; }  /* 倒數字寬固定，避免每秒重排觸發捲動錨定跳動 */
  .ok-chip { display:inline-flex; align-items:center; gap:6px; background:#eaf0e4; color:#4c6340; border-radius:999px; padding:5px 16px; font-size:.82rem; font-weight:700; }
  .hint { font-size:.82rem; margin-top:8px; min-height:1.2em; }
  .hint.ok { color:var(--success); } .hint.err { color:var(--err); }

  /* 底部浮動摘要列 */
  .sumbar { position:fixed; left:50%; transform:translateX(-50%) translateY(140%); bottom:16px; width:min(484px, calc(100% - 36px)); background:var(--heading); color:#fff; border-radius:22px; padding:12px 12px 12px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 18px 40px rgba(20,20,18,.4); z-index:50; transition:transform .3s cubic-bezier(.18,.89,.32,1.12); }
  .sumbar.show { transform:translateX(-50%) translateY(0); }
  .sumbar .info { font-size:.8rem; line-height:1.5; min-width:0; }
  .sumbar .info b { font-family:var(--font-head); color:var(--extra); }
  .sumbar .cta { background:var(--btn); color:#fff; border:0; border-radius:16px; padding:11px 22px; font-weight:700; font-size:.9rem; cursor:pointer; font-family:inherit; flex-shrink:0; min-height:44px; }

  /* 完成畫面（截圖時刻） */
  #success-view { text-align:center; padding:8vh 18px 40px; }
  .moment { max-width:360px; margin:0 auto; padding:32px 26px 28px; text-align:center; background:var(--surface); border-radius:22px; box-shadow:0 16px 40px var(--shadow); position:relative; overflow:hidden; }
  .moment::before { content:""; position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg, var(--primary), var(--extra), var(--accent)); }
  .moment .check { width:70px; height:70px; margin:8px auto 14px; border-radius:50%; background:var(--success); color:#fff; display:grid; place-items:center; font-size:2rem; animation:pop .5s cubic-bezier(.18,.89,.32,1.28); }
  @keyframes pop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
  .moment h3 { font-family:var(--font-head); font-size:1.6rem; color:var(--heading); }
  .moment .when { font-family:var(--font-head); font-size:1.1rem; color:var(--btn); margin:6px 0 2px; }
  .moment p { color:var(--muted); font-size:.84rem; margin-bottom:10px; }
  .moment .oid { display:inline-block; background:var(--surface-alt); border-radius:999px; padding:6px 18px; font-size:.84rem; font-weight:700; color:var(--heading); margin-bottom:16px; }
  .confetti { position:absolute; top:-10px; width:8px; height:12px; border-radius:2px; animation:fall 1.2s ease-in forwards; }
  @keyframes fall { to { transform:translateY(420px) rotate(360deg); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display:none; } .moment .check { animation:none; } .sumbar { transition:none; } }

  footer { text-align:center; font-size:.76rem; color:var(--muted); padding:30px 0 8px; }
  footer a { color:var(--primary-dk); }
</style>
</head>
<body>

<div id="shop-view">
  <div class="wrap">
    <header>
      <div class="logo-dot">💈</div>
      <div class="kicker">PRECISION BARBERSHOP</div>
      <h1>Sharp Cuts Barber</h1>
      <div class="tagline">精準剪裁 ・ 線上預約 ・ 到店服務</div>
      <span class="proof" id="proof-badge">已有預約 <b id="proof-count">0</b> 筆</span>
    </header>

    <div class="svc-chips" id="svc-chips"><div class="svc-skeleton"></div><div class="svc-skeleton"></div></div>

    <div class="calendar">
      <div class="cal-head"><b id="cal-month">選擇日期</b><span class="nav"><button aria-label="往前" onclick="scrollDates(-1)">‹</button><button aria-label="往後" onclick="scrollDates(1)">›</button></span></div>
      <div class="dates" id="dates"></div>
      <div class="cal-divider"></div>
      <div class="slots" id="slots"><div class="slots-note">選擇日期後顯示可預約時段</div></div>
      <div class="hintline">時段顯示剩餘名額，額滿自動劃線</div>
    </div>

    <div class="card hidden" id="book-sec">
      <h3 id="book-anchor">預約資料</h3>
      <div class="sum-row"><span>服務</span><span id="sum-service"></span></div>
      <div class="sum-row"><span>時間</span><span id="sum-when"></span></div>
      <div class="sum-row total"><span>金額</span><b id="sum-price"></b></div>

      <label for="f-email">Email <span style="color:var(--err)">*</span></label>
      <div class="verify-row">
        <input type="email" id="f-email" placeholder="you@example.com" autocomplete="email">
        <button class="btn-line" id="send-code-btn" onclick="sendVerifyCode()">發送驗證碼</button>
      </div>
      <div id="code-row" class="hidden">
        <label for="f-code">驗證碼（6 碼）</label>
        <div class="verify-row">
          <input type="text" id="f-code" inputmode="numeric" maxlength="6">
          <button class="btn-line" id="verify-btn" onclick="verifyEmail()">驗證</button>
        </div>
      </div>
      <div id="verified-chip" class="hidden" style="margin-top:10px"><span class="ok-chip">✓ Email 已驗證</span></div>
      <div class="hint" id="verify-hint"></div>

      <label for="f-name">姓名 <span style="color:var(--err)">*</span></label>
      <input type="text" id="f-name" autocomplete="name">
      <label for="f-phone">電話 <span style="color:var(--err)">*</span></label>
      <input type="tel" id="f-phone" placeholder="09xxxxxxxx" autocomplete="tel">
      <label for="f-note">備註</label>
      <textarea id="f-note" rows="2" placeholder="有什麼需要特別注意的嗎？"></textarea>

      <div style="margin-top:18px; text-align:center">
        <button class="btn-main" id="submit-btn" style="width:100%" onclick="submitBooking()">✂️ 確認送出預約</button>
        <div class="hint err" id="form-error"></div>
      </div>
    </div>

    <footer>Sharp Cuts Barber ✦ 俐落有型的開始 — Powered by <a href="https://one-page-go.com/" rel="noopener">One Page Go</a></footer>
  </div>

  <div class="sumbar" id="sumbar">
    <span class="info" id="sumbar-info"></span>
    <button class="cta" onclick="goBook()">下一步 →</button>
  </div>
</div>

<div id="success-view" class="hidden">
  <div class="moment" id="moment-card">
    <div class="check">✓</div>
    <h3>預約成功！</h3>
    <div class="when" id="success-when"></div>
    <p id="success-meta"></p>
    <span class="oid" id="success-order-id"></span><br>
    <button class="btn-main" onclick="shareThis()">分享給朋友 →</button>
    <div style="margin-top:12px"><button class="btn-line" onclick="addToCalendar()">📅 加入行事曆</button>
    <button class="btn-line" onclick="resetPage()">再次預約</button></div>
  </div>
  <footer>Sharp Cuts Barber ✦ Powered by <a href="https://one-page-go.com/" rel="noopener">One Page Go</a></footer>
</div>

<script>
// ── 設定：交付時替換為該站 worker 的 API 網址 ──
const API_URL = "https://demo-api.one-page-go.com/api"; // demo worker
const SITE_ID = "sharp-cuts"; // demo 接線：所有 action 帶 site_id

const WEEK = ['週日','週一','週二','週三','週四','週五','週六'];
let services = [];
let selectedService = null;
let selectedDate = '';
let selectedTime = '';
let emailVerified = false;
let verifiedEmail = '';
let sessionToken = '';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function setHint(id, msg, ok) {
  const el = document.getElementById(id);
  el.textContent = msg || "";
  el.className = "hint " + (ok ? "ok" : "err");
}
function fmtWhen(dateStr, time) {
  const d = new Date(dateStr + 'T00:00:00');
  return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WEEK[d.getDay()].charAt(1) + '）' + time;
}

// ── 載入服務與統計 ──
async function loadServices() {
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getServices', site_id: SITE_ID }) });
    const data = await res.json();
    services = (data.services || []).filter(s => s.available !== false);
    renderServiceChips();
  } catch (e) {
    document.getElementById('svc-chips').innerHTML = '<span style="color:var(--muted);font-size:.84rem">服務載入失敗，請重新整理頁面</span>';
  }
}
async function loadStats() {
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getStats', site_id: SITE_ID }) });
    const data = await res.json();
    const n = parseInt(data.orderCount, 10) || 0;
    if (n >= 3) {
      document.getElementById('proof-count').textContent = n;
      document.getElementById('proof-badge').classList.add('show');
    }
  } catch (e) { /* 統計失敗不影響預約 */ }
}
function renderServiceChips() {
  const box = document.getElementById('svc-chips');
  if (!services.length) { box.innerHTML = '<span style="color:var(--muted);font-size:.84rem">目前暫無可預約服務</span>'; return; }
  box.innerHTML = services.map(s =>
    '<button class="svc-chip" id="svc-' + esc(s.id) + '" onclick="selectService(\'' + esc(s.id) + '\')">' +
    esc(s.name) + ' <small>' + (parseInt(s.duration_min, 10) || 0) + ' 分・$' + (parseInt(s.price, 10) || 0).toLocaleString() + '</small></button>').join("");
}
function selectService(id) {
  selectedService = services.find(s => String(s.id) === String(id));
  if (!selectedService) return;
  document.querySelectorAll('.svc-chip').forEach(c => c.classList.remove('on'));
  document.getElementById('svc-' + id).classList.add('on');
  updateSumbar();
}

// ── 日期條（今起 14 天）──
function renderDates() {
  const box = document.getElementById('dates');
  let html = '';
  for (let i = 0; i < 14; i++) {
    const d = new Date(Date.now() + i * 86400000);
    const iso = d.toISOString().slice(0, 10);
    html += '<div class="date-chip" id="date-' + iso + '" onclick="selectDate(\'' + iso + '\')">' +
      '<div class="d">' + d.getDate() + '</div><div class="w">' + WEEK[d.getDay()] + '</div></div>';
  }
  box.innerHTML = html;
  const first = new Date();
  document.getElementById('cal-month').textContent = first.getFullYear() + ' 年 ' + (first.getMonth() + 1) + ' 月';
}
function scrollDates(dir) {
  document.getElementById('dates').scrollBy({ left: dir * 200, behavior: 'smooth' });
}
async function selectDate(iso) {
  selectedDate = iso;
  selectedTime = '';
  updateSumbar();
  document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('on'));
  document.getElementById('date-' + iso).classList.add('on');
  const d = new Date(iso + 'T00:00:00');
  document.getElementById('cal-month').textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
  const grid = document.getElementById('slots');
  grid.innerHTML = '<div class="slots-note">時段載入中…</div>';
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getTimeSlots', site_id: SITE_ID, date: iso }) });
    const data = await res.json();
    const slots = data.slots || [];
    if (!slots.length) { grid.innerHTML = '<div class="slots-note">此日期暫無可預約時段</div>'; return; }
    grid.innerHTML = slots.map(s => {
      const remaining = parseInt(s.remaining, 10) || 0;
      const full = remaining <= 0;
      return '<button class="slot' + (full ? ' full' : '') + '" ' + (full ? 'disabled' : '') +
        ' onclick="selectSlot(this, \'' + esc(s.time_slot) + '\')"><b>' + esc(s.time_slot) + '</b>' +
        '<small>' + (full ? '已額滿' : '剩 ' + remaining + ' 位') + '</small></button>';
    }).join("");
  } catch (e) {
    grid.innerHTML = '<div class="slots-note">載入時段失敗，請重試</div>';
  }
}
function selectSlot(el, time) {
  selectedTime = time;
  document.querySelectorAll('.slot').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  updateSumbar();
}

// ── 底部摘要列 ──
function updateSumbar() {
  const bar = document.getElementById('sumbar');
  if (selectedService && selectedDate && selectedTime) {
    document.getElementById('sumbar-info').innerHTML =
      esc(selectedService.name) + ' ・ ' + esc(fmtWhen(selectedDate, '')) + '<b>' + esc(selectedTime) + '</b> ・ $' + (parseInt(selectedService.price, 10) || 0).toLocaleString();
    bar.classList.add('show');
  } else {
    bar.classList.remove('show');
  }
}
function goBook() {
  document.getElementById('sum-service').textContent = selectedService.name + ' ・ ' + selectedService.duration_min + ' 分鐘';
  document.getElementById('sum-when').textContent = fmtWhen(selectedDate, selectedTime);
  document.getElementById('sum-price').textContent = '$' + (parseInt(selectedService.price, 10) || 0).toLocaleString();
  document.getElementById('book-sec').classList.remove('hidden');
  document.getElementById('book-anchor').scrollIntoView(); // 即時定位：不依賴平滑動畫，避免與其他捲動互搶
}

// ── Email 驗證 ──
async function sendVerifyCode() {
  const email = document.getElementById('f-email').value.trim();
  if (!email || !EMAIL_RE.test(email)) { setHint('verify-hint', '請輸入有效的 Email', false); return; }
  const btn = document.getElementById('send-code-btn');
  btn.disabled = true;
  try {
    const chk = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'checkMember', site_id: SITE_ID, email }) }).then(r => r.json());
    if (chk.blocked) { setHint('verify-hint', '此 Email 已被停用，請聯繫店家', false); btn.disabled = false; return; }
    if (chk.hasActiveOrder) { setHint('verify-hint', '您有未完成的預約，完成後才能再次預約', false); btn.disabled = false; return; }
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'sendVerifyCode', site_id: SITE_ID, email }) });
    const data = await res.json();
    if (data.success) {
      document.getElementById('code-row').classList.remove('hidden');
      setHint('verify-hint', data.message || '驗證碼已寄出，請查看信箱（含垃圾郵件）', true);
      let cd = 60;
      btn.textContent = cd + 's';
      const timer = setInterval(() => {
        cd--;
        btn.textContent = cd + 's';
        if (cd <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '重新發送'; }
      }, 1000);
    } else {
      setHint('verify-hint', data.error || '發送失敗', false);
      btn.disabled = false;
    }
  } catch (e) { setHint('verify-hint', '網路錯誤，請稍後再試', false); btn.disabled = false; }
}
async function verifyEmail() {
  const email = document.getElementById('f-email').value.trim();
  const code = document.getElementById('f-code').value.trim();
  if (!code || code.length !== 6) { setHint('verify-hint', '請輸入 6 位數驗證碼', false); return; }
  const btn = document.getElementById('verify-btn');
  btn.disabled = true;
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyCode', site_id: SITE_ID, email, code }) });
    const data = await res.json();
    if (data.success && data.verified !== false) {
      emailVerified = true;
      verifiedEmail = email;
      sessionToken = data.sessionToken || '';
      document.getElementById('code-row').classList.add('hidden');
      document.getElementById('verified-chip').classList.remove('hidden');
      document.getElementById('send-code-btn').classList.add('hidden');
      document.getElementById('f-email').disabled = true;
      setHint('verify-hint', '', true);
    } else {
      setHint('verify-hint', data.error || '驗證失敗', false);
      btn.disabled = false;
    }
  } catch (e) { setHint('verify-hint', '網路錯誤，請稍後再試', false); btn.disabled = false; }
}

// ── 送出預約 ──
function showError(msg) { document.getElementById('form-error').textContent = msg; }
async function submitBooking() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const note = document.getElementById('f-note').value.trim();
  showError('');
  if (!selectedService || !selectedDate || !selectedTime) { showError('請完成服務、日期、時段選擇'); return; }
  if (!emailVerified) { showError('請先完成 Email 驗證'); return; }
  if (!name || name.length < 2) { showError('請填寫姓名（至少 2 個字）'); return; }
  if (!/^09\d{8}$/.test(phone.replace(/[-\s]/g, ''))) { showError('請輸入有效的手機號碼（09 開頭）'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitBooking',
        site_id: SITE_ID,
        email: verifiedEmail,
        sessionToken,
        name,
        phone: phone.replace(/[-\s]/g, ''),
        service_id: String(selectedService.id),
        booking_date: selectedDate,
        booking_time: selectedTime,
        note
      })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('shop-view').classList.add('hidden');
      document.getElementById('success-view').classList.remove('hidden');
      document.getElementById('success-order-id').textContent = data.bookingId;
      document.getElementById('success-when').textContent = fmtWhen(selectedDate, selectedTime);
      document.getElementById('success-meta').textContent = selectedService.name + ' ・ ' + selectedService.duration_min + ' 分鐘 ・ Sharp Cuts Barber';
      celebrate(document.getElementById('moment-card'));
      window.scrollTo({ top: 0 });
    } else {
      showError(data.error || '預約失敗');
      btn.disabled = false;
      btn.textContent = '✂️ 確認送出預約';
    }
  } catch (e) {
    showError('送出失敗，請稍後再試');
    btn.disabled = false;
    btn.textContent = '✂️ 確認送出預約';
  }
}

// ── 完成卡：彩帶、分享、加入行事曆 ──
function getCSS(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function celebrate(host) {
  const colors = [getCSS('--primary'), getCSS('--extra'), getCSS('--success')];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * .2) + 's';
    host.appendChild(c);
    setTimeout(() => c.remove(), 1500);
  }
}
async function shareThis() {
  const data = { title: document.title, text: '我在 Sharp Cuts 預約了理髮，一起來變有型 →', url: location.href.split('#')[0] };
  try {
    if (navigator.share) { await navigator.share(data); }
    else { await navigator.clipboard.writeText(data.url); alert('連結已複製，貼給朋友吧！'); }
  } catch (_) { /* 使用者取消 */ }
}
function addToCalendar() {
  const dur = parseInt(selectedService.duration_min, 10) || 60;
  const start = new Date(selectedDate + 'T' + selectedTime + ':00');
  const end = new Date(start.getTime() + dur * 60000);
  const fmt = d => d.toISOString().replace(/[-:]/g, '').slice(0, 15);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
    'DTSTART:' + fmt(start), 'DTEND:' + fmt(end),
    'SUMMARY:Sharp Cuts Barber ' + selectedService.name,
    'DESCRIPTION:預約編號 ' + document.getElementById('success-order-id').textContent,
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = 'sharp-cuts-booking.ics';
  a.click();
}
function resetPage() { location.reload(); }

// ── 初始化 ──
(function init() {
  renderDates();
  loadServices();
  loadStats();
})();
