<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Flow State — Studio Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 暖砂職人版式（T-031 C 案）＋霓夜主色點綴（Flow State） */
  :root {
    --bg: #f2ede4; --surface: #fbf8f2; --surface-alt: #e4dccd;
    --primary: #ff2e88; --primary-dk: #d11f6e; --accent: #2db8bc;
    --heading: #3a352d; --text: #4d473d; --muted: #79705f;
    --success: #6f8f5c; --err: #a9502f; --shadow: rgba(58,53,45,.10);
    --btn: #d11f6e; --on-btn: #ffffff; --radius: 14px;
    --font-head: "Fraunces", "Noto Serif TC", serif;
    --font-body: "Noto Sans TC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.75; min-height:100vh; }
  .wrap { max-width:1040px; margin:0 auto; padding:0 20px 60px; }
  .hidden { display:none !important; }
  header.site { text-align:center; padding:34px 0 6px; }
  header.site h1 { font-family:var(--font-head); font-size:2rem; font-weight:600; color:var(--heading); }
  header.site .sub { font-size:.8rem; color:var(--muted); letter-spacing:.24em; text-transform:uppercase; margin-top:2px; }
  .demo-band { text-align:center; margin:14px 0 8px; }
  .demo-band span { display:inline-block; background:var(--surface-alt); color:var(--heading); font-size:.76rem; padding:5px 16px; border-radius:999px; }
  .tabs { display:flex; justify-content:center; gap:8px; margin:16px 0 6px; flex-wrap:wrap; }
  .tab { padding:9px 22px; border-radius:999px; border:1.5px solid var(--surface-alt); background:var(--surface); color:var(--muted); font-size:.88rem; cursor:pointer; font-family:inherit; transition:all .2s; min-height:44px; }
  .tab.on { background:var(--primary-dk); border-color:var(--primary-dk); color:#fff; box-shadow:0 6px 16px var(--shadow); }
  .tab:hover:not(.on) { border-color:var(--primary-dk); color:var(--primary-dk); }
  .who { text-align:center; font-size:.78rem; color:var(--muted); margin-bottom:20px; }
  .who button { background:none; border:none; color:var(--primary-dk); cursor:pointer; text-decoration:underline; font-size:.78rem; font-family:inherit; }
  .card { background:var(--surface); border-radius:var(--radius); padding:24px 26px; margin-bottom:20px; box-shadow:0 8px 24px var(--shadow); }
  h2 { font-family:var(--font-head); font-size:1.3rem; font-weight:600; color:var(--heading); margin-bottom:14px; }
  h2 small { display:block; font-family:var(--font-body); font-size:.72rem; color:var(--accent); letter-spacing:.2em; text-transform:uppercase; font-weight:700; }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
  .toolbar .count { font-size:.8rem; color:var(--muted); margin-left:auto; }
  .btn-line { background:var(--surface); border:1.5px solid var(--surface-alt); color:var(--text); border-radius:999px; padding:7px 18px; font-size:.84rem; cursor:pointer; font-family:inherit; transition:all .2s; min-height:38px; }
  .btn-line:hover { border-color:var(--primary-dk); color:var(--primary-dk); }
  .btn-main { background:var(--btn); color:var(--on-btn); border:0; border-radius:999px; padding:9px 22px; font-size:.86rem; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 6px 16px var(--shadow); transition:transform .15s, filter .2s; min-height:38px; }
  .btn-main:hover { filter:brightness(1.08); } .btn-main:active { transform:translateY(2px) scale(.99); }
  .btn-danger { background:var(--surface); border:1.5px solid #e0b7a4; color:var(--err); border-radius:999px; padding:7px 16px; font-size:.82rem; cursor:pointer; font-family:inherit; transition:all .2s; }
  .btn-danger.armed { background:var(--err); border-color:var(--err); color:#fff; }
  label { display:block; font-size:.78rem; color:var(--muted); margin:10px 0 5px; }
  input { width:100%; padding:10px 14px; border:1.5px solid var(--surface-alt); border-radius:10px; font-family:inherit; font-size:.9rem; background:#fff; color:var(--text); }
  input:focus { outline:2px solid rgba(209,31,110,.22); border-color:var(--primary-dk); }
  .form-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0 14px; }
  .form-grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:0 14px; }
  .prod { display:flex; align-items:center; gap:14px; padding:12px 4px; border-bottom:1.5px dashed var(--surface-alt); flex-wrap:wrap; }
  .prod:last-child { border-bottom:none; }
  .prod .thumb { width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg, var(--primary), var(--accent)); flex-shrink:0; background-size:cover; background-position:center; }
  .prod .info { flex:1; min-width:160px; } .prod .info b { color:var(--heading); }
  .prod .sub2 { font-size:.76rem; color:var(--muted); }
  .prod .price { font-family:var(--font-head); font-weight:600; color:var(--primary-dk); }
  .slot-day { margin-bottom:10px; }
  .slot-day b { font-size:.86rem; color:var(--heading); }
  .slot-chip { display:inline-flex; align-items:center; gap:6px; font-size:.8rem; border:1.5px solid var(--surface-alt); background:#fff; border-radius:999px; padding:4px 6px 4px 12px; margin:3px 6px 3px 0; }
  .slot-chip .cap { color:var(--muted); font-size:.74rem; }
  .slot-chip button { border:none; background:var(--surface-alt); color:var(--err); border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:.8rem; line-height:1; }
  .slot-chip button.armed { background:var(--err); color:#fff; }
  .hint { font-size:.82rem; margin-top:10px; min-height:1.2em; }
  .hint.ok { color:var(--success); } .hint.err { color:var(--err); }
  .empty { text-align:center; color:var(--muted); font-size:.86rem; padding:26px 0; }
  .skeleton { height:64px; border-radius:12px; margin-bottom:12px; background:linear-gradient(90deg, var(--surface-alt) 25%, var(--surface) 50%, var(--surface-alt) 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation:none; } .btn-main { transition:none; } }
  .login-box { max-width:400px; margin:6vh auto 0; text-align:center; }
  .login-box .card { padding:40px 34px; }
  .login-box h2 { font-size:1.7rem; margin-bottom:2px; }
  .login-box p { color:var(--muted); font-size:.8rem; margin-bottom:20px; }
  .login-box label { text-align:left; }
  @media (max-width:720px) { .form-grid, .form-grid4 { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="login-view" class="login-box">
    <div class="card">
      <h2>Flow State</h2>
      <p>Studio Admin Demo ・ 驗證碼登入</p>
      <label for="login-email">管理信箱</label>
      <input type="email" id="login-email" placeholder="任意信箱即可">
      <div style="margin-top:14px"><button class="btn-main" id="send-btn" style="width:100%;padding:12px" onclick="sendCode()">發送驗證碼</button></div>
      <div id="code-area" class="hidden">
        <label for="login-code">驗證碼</label>
        <input type="text" id="login-code" inputmode="numeric" maxlength="6">
        <div style="margin-top:12px"><button class="btn-line" style="width:100%" onclick="verifyLogin()">登入</button></div>
      </div>
      <div class="hint" id="login-hint"></div>
    </div>
  </div>

  <div id="main-view" class="hidden">
    <header class="site">
      <h1>Flow State</h1>
      <div class="sub">Studio Admin</div>
    </header>
    <div class="demo-band"><span>🧘 後台展示 — 資料為虛構示範，每日重置</span></div>
    <div class="tabs">
      <button class="tab on" data-panel="panel-services" onclick="switchTab(this)">課程</button>
      <button class="tab" data-panel="panel-slots" onclick="switchTab(this)">時段</button>
    </div>
    <div class="who">demo 管理者 ・ <button onclick="logout()">登出</button></div>

    <div class="card" id="panel-services">
      <h2><small>Classes</small>課程管理</h2>
      <div class="form-grid">
        <div><label>課程名稱</label><input id="s-name"></div>
        <div><label>價格</label><input id="s-price" type="number" min="0"></div>
        <div><label>時長（分鐘）</label><input id="s-duration" type="number" value="60"></div>
      </div>
      <label>說明</label><input id="s-desc">
      <label>圖片網址（可空）</label><input id="s-image">
      <div class="toolbar" style="margin-top:12px">
        <button class="btn-main" onclick="saveService()">儲存課程</button>
        <button class="btn-line" onclick="resetServiceForm()">清空表單</button>
      </div>
      <input type="hidden" id="s-id">
      <div class="hint" id="service-hint"></div>
      <div id="services-list" style="margin-top:8px"><div class="skeleton"></div></div>
    </div>

    <div class="card hidden" id="panel-slots">
      <h2><small>Time Slots</small>時段管理</h2>
      <div class="form-grid4">
        <div><label>起日</label><input id="ts-start" type="date"></div>
        <div><label>迄日</label><input id="ts-end" type="date"></div>
        <div><label>時段（逗號分隔）</label><input id="ts-times" placeholder="10:00, 14:00, 19:00"></div>
        <div><label>每時段名額</label><input id="ts-cap" type="number" value="2" min="1"></div>
      </div>
      <div class="toolbar" style="margin-top:12px">
        <button class="btn-main" onclick="generateSlots()">批次產生時段</button>
        <button class="btn-line" onclick="dedupeSlots()">清除重複</button>
      </div>
      <div class="hint" id="slots-hint"></div>
      <div id="slots-list" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://demo-api.one-page-go.com/api"; // demo worker
const SITE_ID = "yoga-flow";
let adminToken = "";

async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(Object.assign({ action: action, site_id: SITE_ID }, payload || {})),
  });
  return res.json();
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function setHint(id, msg, ok) {
  const el = document.getElementById(id);
  el.textContent = msg || "";
  el.className = "hint " + (ok ? "ok" : "err");
}
function switchTab(btn) {
  document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("on"); });
  btn.classList.add("on");
  document.querySelectorAll("[id^=panel-]").forEach(function (p) { p.classList.add("hidden"); });
  document.getElementById(btn.dataset.panel).classList.remove("hidden");
}
function armDelete(btn, fn) {
  if (btn.dataset.armed) { btn.dataset.armed = ""; fn(); return; }
  btn.dataset.armed = "1";
  const orig = btn.textContent;
  btn.textContent = btn.classList.contains("slot-x") ? "✕" : "確定刪除？";
  btn.classList.add("armed");
  setTimeout(function () { btn.dataset.armed = ""; btn.textContent = orig; btn.classList.remove("armed"); }, 3000);
}

async function sendCode() {
  const email = document.getElementById("login-email").value.trim();
  if (!email) { setHint("login-hint", "請輸入信箱", false); return; }
  const d = await api("adminSendCode", { email: email });
  setHint("login-hint", d.message || d.error, !d.error);
  if (!d.error) document.getElementById("code-area").classList.remove("hidden");
}
async function verifyLogin() {
  const email = document.getElementById("login-email").value.trim();
  const code = document.getElementById("login-code").value.trim();
  const d = await api("adminVerifyCode", { email: email, code: code });
  if (d.token) {
    adminToken = d.token;
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("main-view").classList.remove("hidden");
    loadServices();
    loadSlots();
  } else { setHint("login-hint", d.error || "登入失敗", false); }
}
function logout() {
  adminToken = "";
  document.getElementById("main-view").classList.add("hidden");
  document.getElementById("login-view").classList.remove("hidden");
}

async function loadServices() {
  const d = await api("adminListServices", { token: adminToken });
  if (d.error) { setHint("service-hint", d.error, false); return; }
  const list = document.getElementById("services-list");
  const ss = d.services || [];
  if (!ss.length) { list.innerHTML = '<div class="empty">還沒有課程</div>'; return; }
  list.innerHTML = ss.map(function (s) {
    const thumb = s.image_url ? ' style="background-image:url(\'' + esc(s.image_url) + '\')"' : "";
    return '<div class="prod"><div class="thumb"' + thumb + '></div>' +
      '<div class="info"><b>' + esc(s.name) + '</b><br><span class="sub2">' + esc(s.duration_min) + ' 分鐘</span></div>' +
      '<span class="price">$' + (parseInt(s.price, 10) || 0).toLocaleString() + '</span>' +
      "<button class='btn-line' onclick='editService(" + JSON.stringify(s).replace(/'/g, "&#39;") + ")'>編輯</button>" +
      '<button class="btn-danger" onclick="armDelete(this, deleteService.bind(null, \'' + esc(s.rowNum) + '\'))">刪除</button></div>';
  }).join("");
}
function editService(s) {
  document.getElementById("s-id").value = s.rowNum;
  document.getElementById("s-name").value = s.name || "";
  document.getElementById("s-desc").value = s.description || "";
  document.getElementById("s-price").value = s.price || 0;
  document.getElementById("s-duration").value = s.duration_min || 60;
  document.getElementById("s-image").value = s.image_url || "";
}
function resetServiceForm() {
  ["s-id", "s-name", "s-desc", "s-price", "s-image"].forEach(function (id) { document.getElementById(id).value = ""; });
  document.getElementById("s-duration").value = 60;
}
async function saveService() {
  const d = await api("adminSaveService", { token: adminToken, service: {
    rowNum: document.getElementById("s-id").value,
    name: document.getElementById("s-name").value,
    description: document.getElementById("s-desc").value,
    price: document.getElementById("s-price").value,
    duration_min: document.getElementById("s-duration").value,
    image_url: document.getElementById("s-image").value,
  }});
  setHint("service-hint", d.error || ("已儲存（" + d.id + "）"), !d.error);
  if (!d.error) { resetServiceForm(); loadServices(); }
}
async function deleteService(id) {
  const d = await api("adminDeleteService", { token: adminToken, rowNum: id });
  setHint("service-hint", d.error || "已刪除", !d.error);
  loadServices();
}

async function loadSlots() {
  const d = await api("adminListTimeSlots", { token: adminToken });
  if (d.error) { setHint("slots-hint", d.error, false); return; }
  const byDate = {};
  (d.slots || []).forEach(function (s) { (byDate[s.date] = byDate[s.date] || []).push(s); });
  const dates = Object.keys(byDate).sort();
  const list = document.getElementById("slots-list");
  if (!dates.length) { list.innerHTML = '<div class="empty">還沒有時段</div>'; return; }
  list.innerHTML = dates.map(function (date) {
    const chips = byDate[date].map(function (s) {
      return '<span class="slot-chip">' + esc(s.time_slot) + ' <span class="cap">' + esc(s.booked_count) + "/" + esc(s.max_capacity) + '</span>' +
        '<button class="slot-x" title="刪除" onclick="armDelete(this, deleteSlot.bind(null, ' + s.rowNum + '))">×</button></span>';
    }).join("");
    return '<div class="slot-day"><b>' + esc(date) + "</b><br>" + chips + "</div>";
  }).join("");
}
async function generateSlots() {
  const times = document.getElementById("ts-times").value.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
  const d = await api("adminGenerateTimeSlots", { token: adminToken,
    startDate: document.getElementById("ts-start").value,
    endDate: document.getElementById("ts-end").value,
    times: times,
    capacity: document.getElementById("ts-cap").value,
  });
  setHint("slots-hint", d.error || ("已產生 " + d.created + " 筆（略過 " + d.skipped + " 筆既有）"), !d.error);
  if (!d.error) loadSlots();
}
async function deleteSlot(rowNum) {
  const d = await api("adminDeleteTimeSlot", { token: adminToken, rowNum: rowNum });
  setHint("slots-hint", d.error || "已刪除時段", !d.error);
  loadSlots();
}
async function dedupeSlots() {
  const d = await api("adminDedupeTimeSlots", { token: adminToken });
  setHint("slots-hint", d.error || ("已清除 " + d.removed + " 筆重複"), !d.error);
  loadSlots();
}
</script>
</body>
</html>
