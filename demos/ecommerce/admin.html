<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Bloom Bakery — 商家後台 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 暖砂職人版式（T-031 C 案）＋奶油玫瑰主色（Bloom Bakery） */
  :root {
    --bg: #fdf6ee; --surface: #fffcf8; --surface-alt: #f5e6d3;
    --primary: #c97d7d; --primary-dk: #a85659; --accent: #7dba6a;
    --heading: #7a4f3a; --text: #4a3428; --muted: #8a6a5d;
    --success: #7dba6a; --err: #a9502f; --shadow: rgba(122,79,58,.12);
    --btn: #a85659; --on-btn: #ffffff; --radius: 14px;
    --font-head: "Fraunces", "Noto Serif TC", serif;
    --font-body: "Noto Sans TC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.75; min-height:100vh; }
  .wrap { max-width:1040px; margin:0 auto; padding:0 20px 60px; }
  .hidden { display:none !important; }
  header.site { text-align:center; padding:34px 0 6px; }
  header.site h1 { font-family:var(--font-head); font-size:2rem; font-weight:600; color:var(--heading); }
  header.site .sub { font-size:.8rem; color:var(--muted); letter-spacing:.24em; text-transform:uppercase; margin-top:2px; }
  .demo-band { text-align:center; margin:14px 0 8px; }
  .demo-band span { display:inline-block; background:var(--surface-alt); color:var(--heading); font-size:.76rem; padding:5px 16px; border-radius:999px; }
  .who { text-align:center; font-size:.78rem; color:var(--muted); margin-bottom:20px; }
  .who button { background:none; border:none; color:var(--primary-dk); cursor:pointer; text-decoration:underline; font-size:.78rem; font-family:inherit; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:22px; }
  .stat { background:var(--surface); border-radius:var(--radius); padding:18px 22px; box-shadow:0 8px 24px var(--shadow); position:relative; overflow:hidden; }
  .stat::after { content:""; position:absolute; right:-18px; top:-18px; width:64px; height:64px; border-radius:50%; background:var(--surface-alt); opacity:.6; }
  .stat .k { font-size:.78rem; color:var(--muted); }
  .stat .v { font-family:var(--font-head); font-size:1.9rem; font-weight:600; color:var(--primary-dk); line-height:1.3; }
  .card { background:var(--surface); border-radius:var(--radius); padding:24px 26px; margin-bottom:20px; box-shadow:0 8px 24px var(--shadow); }
  h2 { font-family:var(--font-head); font-size:1.3rem; font-weight:600; color:var(--heading); margin-bottom:14px; }
  h2 small { display:block; font-family:var(--font-body); font-size:.72rem; color:var(--accent); letter-spacing:.2em; text-transform:uppercase; font-weight:700; }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
  .toolbar .count { font-size:.8rem; color:var(--muted); margin-left:auto; }
  .btn-line { background:var(--surface); border:1.5px solid var(--surface-alt); color:var(--text); border-radius:999px; padding:7px 18px; font-size:.84rem; cursor:pointer; font-family:inherit; transition:all .2s; min-height:38px; }
  .btn-line:hover { border-color:var(--primary); color:var(--primary-dk); }
  .btn-main { background:var(--btn); color:var(--on-btn); border:0; border-radius:999px; padding:9px 22px; font-size:.86rem; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 6px 16px var(--shadow); transition:transform .15s, filter .2s; min-height:38px; }
  .btn-main:hover { filter:brightness(1.08); } .btn-main:active { transform:translateY(2px) scale(.99); }
  .order { display:grid; grid-template-columns:1fr auto; gap:6px 16px; padding:16px 18px; border:1.5px solid var(--surface-alt); border-radius:12px; margin-bottom:12px; background:#fff; transition:box-shadow .2s, transform .2s; }
  .order:hover { box-shadow:0 10px 24px var(--shadow); transform:translateY(-2px); }
  .order .line1 { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .order .oid { font-size:.76rem; color:var(--muted); }
  .order .name { font-weight:700; color:var(--heading); }
  .order .items { font-size:.86rem; }
  .order .meta { font-size:.76rem; color:var(--muted); }
  .order .right { text-align:right; display:flex; flex-direction:column; gap:8px; align-items:flex-end; justify-content:center; }
  .order .money { font-family:var(--font-head); font-weight:600; font-size:1.25rem; color:var(--primary-dk); }
  .chip { display:inline-block; padding:3px 12px; border-radius:999px; font-size:.76rem; font-weight:500; background:var(--surface-alt); color:var(--heading); }
  .chip.paid { background:#e4efdd; color:#4f7040; }
  label { display:block; font-size:.78rem; color:var(--muted); margin:10px 0 5px; }
  input { width:100%; padding:10px 14px; border:1.5px solid var(--surface-alt); border-radius:10px; font-family:inherit; font-size:.9rem; background:#fff; color:var(--text); }
  input:focus { outline:2px solid rgba(168,86,89,.25); border-color:var(--primary); }
  .hint { font-size:.82rem; margin-top:10px; min-height:1.2em; }
  .hint.ok { color:var(--success); } .hint.err { color:var(--err); }
  .empty { text-align:center; color:var(--muted); font-size:.86rem; padding:26px 0; }
  .skeleton { height:64px; border-radius:12px; margin-bottom:12px; background:linear-gradient(90deg, var(--surface-alt) 25%, var(--surface) 50%, var(--surface-alt) 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation:none; } .order, .btn-main { transition:none; } }
  .login-box { max-width:400px; margin:6vh auto 0; text-align:center; }
  .login-box .card { padding:40px 34px; }
  .login-box h2 { font-size:1.7rem; margin-bottom:2px; }
  .login-box p { color:var(--muted); font-size:.8rem; margin-bottom:20px; }
  .login-box label { text-align:left; }
  .tip { background:var(--surface-alt); border-radius:10px; padding:8px 14px; font-size:.78rem; color:var(--heading); margin-bottom:14px; }
  @media (max-width:720px) { .stats { grid-template-columns:1fr; } .order { grid-template-columns:1fr; } .order .right { align-items:flex-start; text-align:left; flex-direction:row; flex-wrap:wrap; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="login-view" class="login-box">
    <div class="card">
      <h2>Bloom Bakery</h2>
      <p>商家後台 Demo ・ 密碼登入</p>
      <div class="tip">示範模式：密碼是 <b>admin123123</b>，資料每天自動重置</div>
      <label for="login-password">後台密碼</label>
      <input type="password" id="login-password" value="admin123123">
      <div style="margin-top:14px"><button class="btn-main" style="width:100%;padding:12px" onclick="login()">登入後台</button></div>
      <div class="hint" id="login-hint"></div>
    </div>
  </div>

  <div id="main-view" class="hidden">
    <header class="site">
      <h1>Bloom Bakery</h1>
      <div class="sub">Merchant Studio</div>
    </header>
    <div class="demo-band"><span>🧁 後台展示 — 訂單為虛構示範資料，每日重置</span></div>
    <div class="who">demo 管理者 ・ <button onclick="logout()">登出</button></div>

    <div class="stats">
      <div class="stat"><div class="k">訂單總數</div><div class="v" id="st-total">—</div></div>
      <div class="stat"><div class="k">待處理</div><div class="v" id="st-pending">—</div></div>
      <div class="stat"><div class="k">累計金額</div><div class="v" id="st-sum">—</div></div>
    </div>

    <div class="card">
      <h2><small>Orders</small>訂單管理</h2>
      <div class="toolbar">
        <button class="btn-line" onclick="loadOrders()">重新整理</button>
        <button class="btn-line" onclick="exportCsv()">匯出 CSV</button>
        <span class="count" id="order-count"></span>
      </div>
      <div id="orders-list"><div class="skeleton"></div><div class="skeleton"></div></div>
      <div class="hint" id="orders-hint"></div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://demo-api.one-page-go.com/api"; // demo worker
const SITE_ID = "bloom-bakery";
let adminToken = "";
let lastOrders = [];

async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(Object.assign({ action: action, site_id: SITE_ID }, payload || {})),
  });
  return res.json();
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function setHint(id, msg, ok) {
  const el = document.getElementById(id);
  el.textContent = msg || "";
  el.className = "hint " + (ok ? "ok" : "err");
}

async function login() {
  const password = document.getElementById("login-password").value.trim();
  const d = await api("adminLogin", { password: password });
  if (d.adminToken) {
    adminToken = d.adminToken;
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("main-view").classList.remove("hidden");
    loadOrders();
  } else { setHint("login-hint", d.error || "登入失敗", false); }
}
function logout() {
  adminToken = "";
  document.getElementById("main-view").classList.add("hidden");
  document.getElementById("login-view").classList.remove("hidden");
}

function updateStats(orders) {
  document.getElementById("st-total").textContent = orders.length + " 筆";
  document.getElementById("st-pending").textContent = orders.filter(function (o) { return String(o.order_status).trim() === "待確認"; }).length + " 筆";
  const sum = orders.reduce(function (s, o) { return s + (parseInt(o.total, 10) || 0); }, 0);
  document.getElementById("st-sum").textContent = "$" + sum.toLocaleString();
}
async function loadOrders() {
  const d = await api("adminGetOrders", { adminToken: adminToken });
  if (d.error) { setHint("orders-hint", d.error, false); return; }
  const orders = d.orders || [];
  lastOrders = orders;
  document.getElementById("order-count").textContent = "共 " + orders.length + " 筆";
  updateStats(orders);
  const list = document.getElementById("orders-list");
  if (!orders.length) { list.innerHTML = '<div class="empty">目前沒有訂單（每天早上重置後會補上示範資料）</div>'; return; }
  list.innerHTML = orders.map(function (o) {
    const st = String(o.order_status || "").trim();
    return '<div class="order">' +
      '<div><div class="line1"><span class="name">' + esc(o.name) + '</span><span class="oid">' + esc(o.order_id) + ' ・ ' + esc(o.email) + '</span></div>' +
      '<div class="items">' + esc(o.items) + '</div>' +
      '<div class="meta">取貨 ' + esc(o.pickup_date) + ' ・ 電話 ' + esc(o.phone) + (o.note ? ' ・ 備註：' + esc(o.note) : '') + '</div></div>' +
      '<div class="right"><span class="money">$' + (parseInt(o.total, 10) || 0).toLocaleString() + '</span>' +
      '<span class="chip' + (st === "已付清" || st === "已取貨" ? " paid" : "") + '">' + esc(st) + '</span></div></div>';
  }).join("");
  setHint("orders-hint", "", true);
}
function exportCsv() {
  if (!lastOrders.length) { setHint("orders-hint", "沒有資料可匯出", false); return; }
  const headers = Object.keys(lastOrders[0]);
  const rows = [headers.join(",")].concat(lastOrders.map(function (o) {
    return headers.map(function (h) {
      const v = String(o[h] == null ? "" : o[h]);
      return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(",");
  }));
  const blob = new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "orders-demo.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
