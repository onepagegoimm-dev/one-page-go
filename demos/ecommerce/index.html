<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom Bakery 烘焙訂購</title>
<meta name="description" content="Bloom Bakery 每日手工烘焙，線上訂購、到店取貨。">
<meta property="og:title" content="Bloom Bakery — 每日手工烘焙">
<meta property="og:description" content="季節限定甜點與麵包，線上訂購、到店取貨。">
<meta property="og:image" content="https://one-page-go.com/demos/ecommerce/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ── 主題 token（奶油玫瑰）；版型＝分屏精品櫥窗（T-032 版型 2）──
     交付其他品牌時換 :root token 與品牌文案，版型不動 */
  :root {
    --bg: #fdf6ee; --surface: #fffcf8; --surface-alt: #f5e6d3;
    --primary: #e8a0a0; --primary-dk: #c97d7d; --accent: #f2c4c4;
    --extra: #f7d08a;
    --heading: #7a4f3a; --text: #4a3428; --muted: #8a6a5d;
    --success: #7dba6a; --err: #b0563a; --shadow: rgba(122,79,58,.12);
    --btn: #a85659; --on-btn: #ffffff; --radius: 18px;
    --font-head: "Fraunces", "Noto Serif TC", serif;
    --font-body: "Noto Sans TC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15.5px; line-height:1.8; min-height:100vh; overflow-x:hidden; }
  .hidden { display:none !important; }
  img { max-width:100%; }

  /* ── 分屏骨架 ──
     手機優先：單欄；≥880px 才分屏 */
  .split { display:block; max-width:1180px; margin:0 auto; }

  /* 品牌面板 */
  aside.brand { background:linear-gradient(160deg, var(--accent), var(--primary)); padding:38px 24px 26px; border-radius:0 0 28px 28px; text-align:center; }
  .logo-dot { width:64px; height:64px; margin:0 auto 12px; border-radius:50%; background:#fff; display:grid; place-items:center; font-size:1.9rem; box-shadow:0 10px 26px rgba(122,79,58,.25); }
  aside.brand h1 { font-family:var(--font-head); font-size:2.1rem; font-weight:700; color:#fff; line-height:1.25; text-shadow:0 2px 14px rgba(122,79,58,.2); }
  aside.brand .tagline { color:#fff; opacity:.92; font-size:.82rem; margin:6px 0 14px; }
  .proof { background:rgba(255,255,255,.28); border-radius:14px; padding:8px 18px; color:#fff; font-size:.8rem; display:none; }
  .proof.show { display:inline-block; }
  .proof b { font-family:var(--font-head); font-size:1.15rem; }
  aside.brand .meta { color:#fff; opacity:.88; font-size:.76rem; line-height:2; margin-top:14px; }

  /* 主內容 */
  main { padding:26px 18px 150px; }
  .sec-head { margin-bottom:14px; }
  .sec-head h2 { font-family:var(--font-head); font-size:1.5rem; font-weight:600; color:var(--heading); }
  .sec-head span { font-size:.78rem; color:var(--muted); }

  /* 橫式商品列 */
  .product { display:grid; grid-template-columns:104px 1fr; background:var(--surface); border-radius:var(--radius); box-shadow:0 10px 26px var(--shadow); overflow:hidden; margin-bottom:14px; transition:transform .2s ease, box-shadow .2s ease; }
  .product:hover { transform:translateX(4px); box-shadow:0 14px 32px var(--shadow); }
  .product .ph { background:linear-gradient(135deg, var(--accent), var(--primary)); display:grid; place-items:center; min-height:118px; overflow:hidden; }
  .product .ph img { width:100%; height:100%; object-fit:cover; }
  .product .ph .initial { font-family:var(--font-head); font-size:2rem; color:rgba(255,255,255,.9); }
  .product .body { padding:13px 15px 14px; display:flex; flex-direction:column; min-width:0; }
  .product .name { font-family:var(--font-head); font-weight:600; font-size:1.08rem; color:var(--heading); }
  .product .name .tag { display:inline-block; font-size:.66rem; font-weight:900; background:var(--extra); color:var(--heading); padding:2px 10px; border-radius:999px; vertical-align:2px; margin-left:6px; font-family:var(--font-body); }
  .product .desc { font-size:.78rem; color:var(--muted); margin:1px 0 auto; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .price { font-family:var(--font-head); font-weight:700; font-size:1.2rem; color:var(--btn); }
  .qty { display:flex; align-items:center; gap:8px; }
  .qty button { width:38px; height:38px; border-radius:50%; border:1.5px solid var(--surface-alt); background:#fff; color:var(--primary-dk); font-size:1.05rem; font-weight:700; cursor:pointer; transition:all .18s; flex-shrink:0; }
  .qty button:hover { background:var(--primary); border-color:var(--primary); color:#fff; }
  .qty button:active { transform:scale(.92); }
  .qty b { min-width:20px; text-align:center; font-size:1rem; }
  .skeleton { height:118px; border-radius:var(--radius); margin-bottom:14px; background:linear-gradient(90deg, var(--surface-alt) 25%, var(--surface) 50%, var(--surface-alt) 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .empty { text-align:center; color:var(--muted); font-size:.88rem; padding:30px 0; }
  .fade-up { opacity:0; transform:translateY(16px); transition:opacity .45s ease, transform .45s ease; }
  .fade-up.in { opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce) { .fade-up { opacity:1; transform:none; transition:none; } .skeleton { animation:none; } }

  /* 結帳區 */
  .card { background:var(--surface); border-radius:var(--radius); padding:20px 20px 22px; margin-bottom:16px; box-shadow:0 10px 26px var(--shadow); }
  .cart-lines { border-bottom:1.5px dashed var(--surface-alt); margin-bottom:12px; padding-bottom:6px; }
  .cart-line { display:flex; justify-content:space-between; font-size:.86rem; margin-bottom:6px; gap:12px; }
  .cart-line .n { color:var(--muted); min-width:0; }
  .cart-total { display:flex; justify-content:space-between; align-items:center; font-size:.9rem; }
  .cart-total b { font-family:var(--font-head); font-size:1.3rem; color:var(--btn); }
  label { display:block; font-size:.78rem; color:var(--muted); margin:12px 0 5px; }
  input, textarea { width:100%; padding:11px 14px; border:1.5px solid var(--surface-alt); border-radius:12px; font-family:inherit; font-size:.92rem; background:#fff; color:var(--text); }
  input:focus, textarea:focus { outline:2px solid rgba(168,86,89,.25); border-color:var(--primary); }
  .btn-main { background:var(--btn); color:var(--on-btn); border:0; border-radius:999px; padding:12px 26px; font-weight:900; font-size:.94rem; cursor:pointer; font-family:inherit; box-shadow:0 8px 20px var(--shadow); transition:transform .15s, filter .2s; min-height:48px; }
  .btn-main:hover { filter:brightness(1.08); } .btn-main:active { transform:translateY(2px) scale(.99); }
  .btn-main:disabled { opacity:.55; cursor:not-allowed; }
  .btn-line { background:var(--surface); border:1.5px solid var(--surface-alt); color:var(--text); border-radius:999px; padding:9px 18px; font-size:.86rem; cursor:pointer; font-family:inherit; transition:all .2s; min-height:42px; white-space:nowrap; }
  .btn-line:hover { border-color:var(--primary); color:var(--primary-dk); }
  .btn-line:disabled { opacity:.55; cursor:not-allowed; }
  .verify-row { display:flex; gap:10px; }
  .verify-row input { flex:1; min-width:0; }
  .verify-row .btn-line { min-width:118px; }  /* 倒數字寬固定，避免每秒重排觸發捲動錨定跳動 */

  .ok-chip { display:inline-flex; align-items:center; gap:6px; background:#eaf3e4; color:#4f7040; border-radius:999px; padding:5px 16px; font-size:.82rem; font-weight:700; }
  .hint { font-size:.82rem; margin-top:8px; min-height:1.2em; }
  .hint.ok { color:var(--success); } .hint.err { color:var(--err); }

  /* 購物袋：手機＝底部列；桌機＝右下抽屜 */
  .drawer { position:fixed; z-index:60; left:0; right:0; bottom:0; background:var(--surface); border-radius:20px 20px 0 0; box-shadow:0 -10px 30px var(--shadow); transform:translateY(120%); transition:transform .3s cubic-bezier(.18,.89,.32,1.12); }
  .drawer.show { transform:translateY(0); }
  .drawer .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .drawer .sum { font-size:.78rem; color:var(--muted); line-height:1.4; }
  .drawer .sum b { display:block; font-family:var(--font-head); font-size:1.25rem; color:var(--heading); }
  .drawer .cta { background:var(--btn); color:#fff; border:0; border-radius:999px; padding:12px 26px; font-weight:900; font-size:.92rem; cursor:pointer; font-family:inherit; min-height:46px; }
  .drawer .cta:active { transform:translateY(1px); }

  /* 完成畫面 */
  #success-view { text-align:center; padding:8vh 18px 40px; }
  .moment { max-width:360px; margin:0 auto; padding:32px 26px 28px; text-align:center; background:var(--surface); border-radius:var(--radius); box-shadow:0 16px 40px var(--shadow); position:relative; overflow:hidden; }
  .moment::before { content:""; position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg, var(--primary), var(--extra), var(--accent)); }
  .moment .check { width:70px; height:70px; margin:8px auto 14px; border-radius:50%; background:var(--success); color:#fff; display:grid; place-items:center; font-size:2rem; animation:pop .5s cubic-bezier(.18,.89,.32,1.28); }
  @keyframes pop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
  .moment h3 { font-family:var(--font-head); font-size:1.6rem; color:var(--heading); }
  .moment p { color:var(--muted); font-size:.86rem; margin:6px 0 10px; }
  .moment .oid { display:inline-block; background:var(--surface-alt); border-radius:999px; padding:6px 18px; font-size:.84rem; font-weight:700; color:var(--heading); margin-bottom:16px; }
  .confetti { position:absolute; top:-10px; width:8px; height:12px; border-radius:2px; animation:fall 1.2s ease-in forwards; }
  @keyframes fall { to { transform:translateY(420px) rotate(360deg); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display:none; } .moment .check { animation:none; } }

  footer { text-align:center; font-size:.76rem; color:var(--muted); padding:30px 0 8px; }
  footer a { color:var(--primary-dk); }

  /* ── 桌機分屏（≥880px）── */
  @media (min-width:880px) {
    .split { display:grid; grid-template-columns:380px 1fr; }
    aside.brand { position:sticky; top:0; height:100vh; border-radius:0 32px 32px 0; text-align:left; padding:48px 40px; display:flex; flex-direction:column; justify-content:center; }
    .logo-dot { margin:0 0 18px; width:72px; height:72px; }
    aside.brand h1 { font-size:2.5rem; }
    aside.brand .meta { margin-top:auto; }
    main { padding:44px 40px 60px; }
    .product { grid-template-columns:150px 1fr; }
    .product .ph { min-height:132px; }
    .drawer { left:auto; right:24px; bottom:24px; width:300px; border-radius:20px; transform:translateY(140%); }
    .drawer.show { transform:translateY(0); }
    .drawer .lines { padding:12px 18px 0; }
    .drawer .line { display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); margin-bottom:6px; gap:12px; }
    .drawer .bar { padding:10px 16px 14px; }
  }
  /* 手機：抽屜明細列隱藏（保持低干擾），僅合計＋CTA */
  @media (max-width:879.98px) { .drawer .lines { display:none; } }
</style>
</head>
<body>

<div id="shop-view">
  <div class="split">
    <aside class="brand">
      <div class="logo-dot">🧁</div>
      <h1>Bloom Bakery</h1>
      <div class="tagline">每日現烤 ・ 售完為止 ・ 到店取貨</div>
      <span class="proof" id="proof-badge">已有訂購 <b id="proof-count">0</b> 筆</span>
      <div class="meta">🕐 週二至週日 10:00–19:00<br>📍 台北市甜點路 12 號</div>
    </aside>

    <main>
      <div class="sec-head"><h2>本日商品</h2><span>新鮮手作，點「＋」加入購物袋</span></div>
      <div id="products-list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

      <div id="checkout-sec" class="hidden">
        <div class="sec-head" id="checkout-anchor" style="margin-top:26px"><h2>訂購資訊</h2><span>完成 Email 驗證即可送出</span></div>

        <div class="card">
          <div class="cart-lines" id="cart-lines"></div>
          <div class="cart-total"><span>合計</span><b id="cart-total">$0</b></div>
        </div>

        <div class="card">
          <label for="f-email">Email <span style="color:var(--err)">*</span></label>
          <div class="verify-row">
            <input type="email" id="f-email" placeholder="you@example.com" autocomplete="email">
            <button class="btn-line" id="send-code-btn" onclick="sendVerifyCode()">發送驗證碼</button>
          </div>
          <div id="code-row" class="hidden">
            <label for="f-code">驗證碼（6 碼）</label>
            <div class="verify-row">
              <input type="text" id="f-code" inputmode="numeric" maxlength="6">
              <button class="btn-line" id="verify-btn" onclick="verifyEmail()">驗證</button>
            </div>
          </div>
          <div id="verified-chip" class="hidden" style="margin-top:10px"><span class="ok-chip">✓ Email 已驗證</span></div>
          <div class="hint" id="verify-hint"></div>

          <label for="f-name">姓名 <span style="color:var(--err)">*</span></label>
          <input type="text" id="f-name" autocomplete="name">
          <label for="f-phone">電話 <span style="color:var(--err)">*</span></label>
          <input type="tel" id="f-phone" placeholder="09xxxxxxxx" autocomplete="tel">
          <label for="f-date">取貨日期 <span style="color:var(--err)">*</span></label>
          <input type="date" id="f-date">
          <label for="f-note">備註</label>
          <textarea id="f-note" rows="2" placeholder="特殊需求、過敏資訊等…"></textarea>

          <div style="margin-top:18px; text-align:center">
            <button class="btn-main" id="submit-btn" style="width:100%" onclick="submitOrder()">🧁 確認送出訂單</button>
            <div class="hint err" id="form-error"></div>
          </div>
        </div>
      </div>

      <footer>Bloom Bakery ✦ 純手工烘焙，溫暖交給你 — Powered by <a href="https://one-page-go.com/" rel="noopener">One Page Go</a></footer>
    </main>
  </div>

  <!-- 購物袋（手機＝底部列；桌機＝右下抽屜） -->
  <div class="drawer" id="drawer">
    <div class="lines" id="drawer-lines"></div>
    <div class="bar">
      <span class="sum"><span id="bar-count">0</span> 項商品<b id="bar-total">$0</b></span>
      <button class="cta" onclick="goCheckout()">前往結帳 →</button>
    </div>
  </div>
</div>

<div id="success-view" class="hidden">
  <div class="moment" id="moment-card">
    <div class="check">✓</div>
    <h3>訂單已送出！</h3>
    <p id="success-meta">我們會盡快與您確認取貨細節</p>
    <span class="oid" id="success-order-id"></span><br>
    <button class="btn-main" onclick="shareThis()">分享給朋友 →</button>
    <div style="margin-top:12px"><button class="btn-line" onclick="resetPage()">再次訂購</button></div>
  </div>
  <footer>Bloom Bakery ✦ Powered by <a href="https://one-page-go.com/" rel="noopener">One Page Go</a></footer>
</div>

<script>
// ── 設定：交付時替換為該站 worker 的 API 網址 ──
const API_URL = "https://demo-api.one-page-go.com/api"; // demo worker
const SITE_ID = "bloom-bakery"; // demo 接線：所有 action 帶 site_id

let products = [];
let cart = {};
let emailVerified = false;
let verifiedEmail = '';
let sessionToken = '';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function setHint(id, msg, ok) {
  const el = document.getElementById(id);
  el.textContent = msg || "";
  el.className = "hint " + (ok ? "ok" : "err");
}

// ── 載入商品與統計 ──
async function loadProducts() {
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getProducts', site_id: SITE_ID }) });
    const data = await res.json();
    products = (data.products || []).filter(p => p.available !== false);
    renderProducts();
  } catch (e) {
    document.getElementById('products-list').innerHTML = '<div class="empty">載入失敗，請重新整理頁面</div>';
  }
}
async function loadStats() {
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getStats', site_id: SITE_ID }) });
    const data = await res.json();
    const n = parseInt(data.orderCount, 10) || 0;
    if (n >= 3) {
      document.getElementById('proof-count').textContent = n;
      document.getElementById('proof-badge').classList.add('show');
    }
  } catch (e) { /* 統計失敗不影響購物 */ }
}
function renderProducts() {
  const list = document.getElementById('products-list');
  if (!products.length) { list.innerHTML = '<div class="empty">目前暫無商品，請稍後再來</div>'; return; }
  list.innerHTML = products.map((p, i) => {
    const qty = cart[p.id] || 0;
    const ph = p.image_url
      ? '<img src="' + esc(p.image_url) + '" alt="' + esc(p.name) + '" loading="lazy">'
      : '<span class="initial">' + esc(String(p.name || "").charAt(0)) + '</span>';
    const tag = i === 0 ? '<span class="tag">人氣 No.1</span>' : '';
    return '<div class="product fade-up"><div class="ph">' + ph + '</div>' +
      '<div class="body"><div class="name">' + esc(p.name) + tag + '</div>' +
      '<div class="desc">' + esc(p.description) + '</div>' +
      '<div class="row"><span class="price">$' + (parseInt(p.price, 10) || 0).toLocaleString() + '</span>' +
      '<span class="qty"><button aria-label="減少" onclick="changeQty(\'' + esc(p.id) + '\', -1)">−</button><b id="q-' + esc(p.id) + '">' + qty + '</b><button aria-label="增加" onclick="changeQty(\'' + esc(p.id) + '\', 1)">＋</button></span></div>' +
      '</div></div>';
  }).join("");
  requestAnimationFrame(() => {
    document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('in'), i * 70));
  });
}

// ── 購物袋 ──
function changeQty(id, delta) {
  cart[id] = Math.max(0, (cart[id] || 0) + delta);
  document.getElementById('q-' + id).textContent = cart[id];
  updateDrawer();
  renderCheckout();
}
function getCartItems() {
  return products.filter(p => cart[p.id] > 0).map(p => ({ ...p, qty: cart[p.id] }));
}
function updateDrawer() {
  const items = getCartItems();
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById('bar-count').textContent = items.length;
  document.getElementById('bar-total').textContent = '$' + total.toLocaleString();
  document.getElementById('drawer-lines').innerHTML = items.map(i =>
    '<div class="line"><span>' + esc(i.name) + ' ×' + i.qty + '</span><span>$' + (i.price * i.qty).toLocaleString() + '</span></div>').join("");
  document.getElementById('drawer').classList.toggle('show', items.length > 0);
}
function goCheckout() {
  renderCheckout();
  document.getElementById('checkout-sec').classList.remove('hidden');
  document.getElementById('checkout-anchor').scrollIntoView(); // 即時定位：不依賴平滑動畫，避免與其他捲動互搶
}
function renderCheckout() {
  const items = getCartItems();
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  if (!items.length) { document.getElementById('checkout-sec').classList.add('hidden'); return; }
  document.getElementById('cart-lines').innerHTML = items.map(i =>
    '<div class="cart-line"><span class="n">' + esc(i.name) + ' ×' + i.qty + '</span><span>$' + (i.price * i.qty).toLocaleString() + '</span></div>').join("");
  document.getElementById('cart-total').innerHTML = '<span>合計</span><b>$' + total.toLocaleString() + '</b>';
}

// ── Email 驗證 ──
async function sendVerifyCode() {
  const email = document.getElementById('f-email').value.trim();
  if (!email || !EMAIL_RE.test(email)) { setHint('verify-hint', '請輸入有效的 Email', false); return; }
  const btn = document.getElementById('send-code-btn');
  btn.disabled = true;
  try {
    const chk = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'checkMember', site_id: SITE_ID, email }) }).then(r => r.json());
    if (chk.blocked) { setHint('verify-hint', '此 Email 已被停用，請聯繫店家', false); btn.disabled = false; return; }
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'sendVerifyCode', site_id: SITE_ID, email }) });
    const data = await res.json();
    if (data.success) {
      document.getElementById('code-row').classList.remove('hidden');
      setHint('verify-hint', data.message || '驗證碼已寄出，請查看信箱（含垃圾郵件）', true);
      let cd = 60;
      btn.textContent = cd + 's';
      const timer = setInterval(() => {
        cd--;
        btn.textContent = cd + 's';
        if (cd <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '重新發送'; }
      }, 1000);
    } else {
      setHint('verify-hint', data.error || '發送失敗', false);
      btn.disabled = false;
    }
  } catch (e) { setHint('verify-hint', '網路錯誤，請稍後再試', false); btn.disabled = false; }
}
async function verifyEmail() {
  const email = document.getElementById('f-email').value.trim();
  const code = document.getElementById('f-code').value.trim();
  if (!code || code.length !== 6) { setHint('verify-hint', '請輸入 6 位數驗證碼', false); return; }
  const btn = document.getElementById('verify-btn');
  btn.disabled = true;
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyCode', site_id: SITE_ID, email, code }) });
    const data = await res.json();
    if (data.success && data.verified) {
      emailVerified = true;
      verifiedEmail = email;
      sessionToken = data.sessionToken || '';
      document.getElementById('code-row').classList.add('hidden');
      document.getElementById('verified-chip').classList.remove('hidden');
      document.getElementById('send-code-btn').classList.add('hidden');
      document.getElementById('f-email').disabled = true;
      setHint('verify-hint', '', true);
    } else {
      setHint('verify-hint', data.error || '驗證失敗', false);
      btn.disabled = false;
    }
  } catch (e) { setHint('verify-hint', '網路錯誤，請稍後再試', false); btn.disabled = false; }
}

// ── 送出訂單 ──
function showError(msg) { document.getElementById('form-error').textContent = msg; }
async function submitOrder() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const pickupDate = document.getElementById('f-date').value;
  const note = document.getElementById('f-note').value.trim();
  showError('');
  if (!emailVerified) { showError('請先完成 Email 驗證'); return; }
  if (!name || name.length < 2) { showError('請填寫姓名（至少 2 個字）'); return; }
  if (!/^09\d{8}$/.test(phone.replace(/[-\s]/g, ''))) { showError('請輸入有效的手機號碼（09 開頭）'); return; }
  if (!pickupDate) { showError('請選擇取貨日期'); return; }
  const items = getCartItems();
  if (!items.length) { showError('購物袋是空的喔！'); return; }
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitOrder',
        site_id: SITE_ID,
        email: verifiedEmail,
        sessionToken,
        customerName: name,
        phone: phone.replace(/[-\s]/g, ''),
        pickupDate, note, items, total
      })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('shop-view').classList.add('hidden');
      document.getElementById('success-view').classList.remove('hidden');
      document.getElementById('success-order-id').textContent = data.orderId;
      document.getElementById('success-meta').textContent = pickupDate + ' 取貨 ・ Bloom Bakery';
      celebrate(document.getElementById('moment-card'));
      window.scrollTo({ top: 0 });
    } else {
      showError(data.error || '送出失敗');
      btn.disabled = false;
      btn.textContent = '🧁 確認送出訂單';
    }
  } catch (e) {
    showError('送出失敗，請稍後再試');
    btn.disabled = false;
    btn.textContent = '🧁 確認送出訂單';
  }
}

// ── 完成卡：彩帶與分享 ──
function getCSS(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function celebrate(host) {
  const colors = [getCSS('--primary'), getCSS('--extra'), getCSS('--success')];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * .2) + 's';
    host.appendChild(c);
    setTimeout(() => c.remove(), 1500);
  }
}
async function shareThis() {
  const data = { title: document.title, text: '我在 Bloom Bakery 訂了手工甜點！推薦給你 →', url: location.href.split('#')[0] };
  try {
    if (navigator.share) { await navigator.share(data); }
    else { await navigator.clipboard.writeText(data.url); alert('連結已複製，貼給朋友吧！'); }
  } catch (_) { /* 使用者取消 */ }
}
function resetPage() { location.reload(); }

// ── 初始化 ──
(function init() {
  const d = new Date(Date.now() + 86400000);
  document.getElementById('f-date').min = d.toISOString().slice(0, 10);
  loadProducts();
  loadStats();
})();
</script>
